<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IJAIO Sprint Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an exercise book. A red margin rule runs down the left; stop and question numbers sit in the margin, content to its right. The exam screen is an answer sheet: bubbles for options, marks in brackets on the right. */
:root{
  --page:#FFFFFF; --wash:#F2F4F7; --ink:#1B1F2A; --soft:#5B6373; --rule:#E2E5EB;
  --margin:#E3686C; --pen:#1D4ED8; --pen-ink:#FFFFFF; --pen-wash:#EAF0FF; --hl:#FFE680;
  --good:#167A3E; --good-wash:#E2F4E8; --bad:#C2282B; --bad-wash:#FCE7E7;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --mx:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#15171D; --wash:#232733; --ink:#E9EBF1; --soft:#A3AABA; --rule:#2E3340;
  --margin:#D9595E; --pen:#8EABFF; --pen-ink:#0F1730; --pen-wash:#222C4A; --hl:#5E5016;
  --good:#5FCB89; --good-wash:#16301F; --bad:#F27E7E; --bad-wash:#3A1C1F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#15171D; --wash:#232733; --ink:#E9EBF1; --soft:#A3AABA; --rule:#2E3340;
  --margin:#D9595E; --pen:#8EABFF; --pen-ink:#0F1730; --pen-wash:#222C4A; --hl:#5E5016;
  --good:#5FCB89; --good-wash:#16301F; --bad:#F27E7E; --bad-wash:#3A1C1F;
  color-scheme:dark }
@media (max-width:600px){ :root{ --mx:44px } }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 72px}
.wrap{max-width:860px;margin:0 auto}
h1,h2{font-family:var(--f-read);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(30px,5.2vw,41px)}
h2{font-size:clamp(23px,3.6vw,27px)}
h3{font-family:var(--f-ui);font-size:17px;font-weight:700;margin:0;line-height:1.35}
p{margin:0}
code{font-family:var(--f-code);font-size:.86em;background:var(--wash);border-radius:4px;padding:1px 5px}
pre{font-family:var(--f-code);font-size:14px;line-height:1.55;margin:0;white-space:pre;overflow-x:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.soft{color:var(--soft)}
.label{font-size:14.5px;font-weight:700;color:var(--soft)}
.hl{background:var(--hl);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:1px 3px;border-radius:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--page);border-bottom:1px solid var(--rule);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{border:0;background:none;padding:0;text-align:left;font-family:var(--f-read);font-weight:600;font-size:19px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--page);padding:7px 14px;font-weight:700;font-size:15px}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}

/* buttons */
.btn{border:1.5px solid var(--rule);background:var(--page);padding:10px 16px;border-radius:8px;font-weight:700;font-size:15.5px;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:7px 12px;font-size:14.5px}
.btn[disabled]{opacity:.4;cursor:default}
.btn[disabled]:hover{border-color:var(--rule)}
.linkback{border:0;background:none;padding:0;font-weight:700;color:var(--pen);font-size:15.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* the exercise-book sheet: red margin, numbers in the margin */
.sheet{position:relative;padding-left:var(--mx)}
.sheet::before{content:"";position:absolute;left:calc(var(--mx) - 16px);top:0;bottom:0;width:2px;background:var(--margin)}
.mnum{position:absolute;left:0;width:calc(var(--mx) - 28px);text-align:right;font-family:var(--f-read);font-weight:600;font-size:22px;line-height:1.2;color:var(--soft)}

/* route */
.hero{padding-block:30px 26px;display:grid;gap:14px}
.when{font-size:15.5px;color:var(--soft)}
.lede{max-width:60ch;color:var(--soft)}
.next{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--pen-wash);border-radius:10px;padding:16px 18px;margin-top:6px}
.next b{font-size:18px}
.bar{height:6px;background:var(--wash);border-radius:3px;overflow:hidden;margin-top:4px}
.bar > div{height:100%;background:var(--pen)}
.leg{margin-top:30px}
.leg > header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-left:var(--mx);margin-bottom:6px}
.stops{list-style:none;margin:0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:calc(var(--mx) - 16px);top:0;bottom:0;width:2px;background:var(--margin);z-index:1;pointer-events:none}
.stop{display:block;border-bottom:1px solid var(--rule)}
.stop:first-child{border-top:1px solid var(--rule)}
.stopbtn{display:grid;grid-template-columns:var(--mx) minmax(0,1fr) auto;align-items:center;width:100%;border:0;background:none;text-align:left;padding:14px 12px 14px 0}
.stopbtn:hover{background:var(--wash)}
.stopbtn .mnum{position:static;width:auto;padding-right:28px}
.stopbtn b{font-size:17.5px;display:block}
.stopbtn small{color:var(--soft);font-size:15px;display:block}
.stopbtn .r{font-size:14.5px;color:var(--soft);text-align:right;white-space:nowrap;padding-left:14px}
.stop.done .mnum{color:var(--good)}
.stop.done .r{color:var(--good);font-weight:700}
.stop.here .stopbtn{background:var(--pen-wash)}
.stop.here .mnum{color:var(--pen)}
.stop.here .r{color:var(--pen);font-weight:700}

/* step pages */
.crumb{padding-block:18px 6px}
.stephead{padding-block:12px 22px}
.stephead .mnum{top:16px;font-size:30px;color:var(--ink)}
.stephead p{color:var(--soft);margin-top:6px;max-width:60ch}
.block{display:grid;gap:14px;margin-bottom:34px}
.block > h2{font-size:21px}
.intro{max-width:62ch;color:var(--soft)}

.fact{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--rule)}
.fact:last-child{border-bottom:1px solid var(--rule)}
.fact .rule{font-family:var(--f-read);font-size:20.5px;line-height:1.5;max-width:58ch}
.fact .rule b{font-weight:600}
.hook{color:var(--soft);font-style:italic;max-width:62ch}
.ex{background:var(--wash);border-radius:8px;padding:12px 14px;max-width:66ch;overflow-x:auto}
.trap{max-width:66ch}
.trap b{margin-right:4px}

.q{border:1px solid var(--rule);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0;background:var(--page)}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.qtext{font-size:18px;font-weight:700;line-height:1.45;max-width:66ch}
.marks{font-size:15px;color:var(--soft);white-space:nowrap}
.byhand{font-family:var(--f-code);font-size:15px;background:var(--wash);border-radius:8px;padding:10px 14px;overflow-x:auto}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1.5px solid var(--rule);background:var(--page);border-radius:8px;padding:10px 14px;width:100%;font-size:16.5px;line-height:1.4}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--soft)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--pen);background:var(--pen-wash)}
.opt.sel .bub{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--page)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--page)}
.opt:disabled{cursor:default}
.why{max-width:66ch}
.why b{margin-right:4px}
.why.ok b{color:var(--good)}
.why.no b{color:var(--bad)}
.score-line{font-size:15.5px;color:var(--soft)}

.recipe{margin:0;padding-left:22px;display:grid;gap:4px;max-width:62ch}
.model{background:var(--good-wash);border-radius:8px;padding:12px 14px;max-width:70ch;overflow-x:auto}
.model pre{background:var(--page);border-radius:6px;padding:10px 12px;margin-top:8px}
.list{list-style:none;margin:0;padding:0}
.list li{padding-block:12px;border-top:1px solid var(--rule);max-width:70ch}
.list li:last-child{border-bottom:1px solid var(--rule)}
.list b{display:block}
table.plan{border-collapse:collapse;width:100%;font-size:16px}
table.plan th,table.plan td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.plan th{font-size:14.5px;color:var(--soft)}
table.plan td:nth-child(2){white-space:nowrap;font-weight:700}
.tablewrap{overflow-x:auto}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:16px}
.facts b{font-family:var(--f-read);font-weight:600;font-size:19px;margin-right:4px}
.cheat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.cheat div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding-block:10px;border-top:1px solid var(--rule);font-size:16px}
.cheat b{font-size:15.5px}
@media (max-width:700px){.cheat{grid-template-columns:1fr}}
.code-ed{font-family:var(--f-code);font-size:14px;line-height:1.55;width:100%;tab-size:4;white-space:pre;overflow-x:auto;background:var(--wash);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;resize:vertical}
.out{font-family:var(--f-code);font-size:14px;background:var(--ink);color:var(--page);border-radius:8px;padding:10px 14px;white-space:pre-wrap;word-break:break-word;min-height:44px}
.stepfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-top:2px solid var(--ink);padding-top:18px;margin-top:10px}
.empty{border:1.5px dashed var(--rule);border-radius:10px;padding:24px;display:grid;gap:6px;text-align:center;justify-items:center}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choose > div{border:1px solid var(--rule);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start}
.choose > div.rec{border:2px solid var(--pen)}
@media (max-width:680px){.choose{grid-template-columns:1fr}}

/* exam: an answer sheet */
.xbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:var(--page);border-radius:0 0 10px 10px;padding:10px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center}
.xbar .nm{font-weight:700;font-size:15px;line-height:1.3;min-width:0}
.xbar .nm span{display:block;font-weight:400;opacity:.75;font-size:14px}
.clock{font-family:var(--f-read);font-variant-numeric:lining-nums tabular-nums;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.low{color:var(--hl)}
.xbar .btn{background:var(--page);color:var(--ink);border-color:var(--page)}
@media (max-width:560px){.xbar{grid-template-columns:minmax(0,1fr) auto}.xbar .nm{grid-column:1/-1}}
.xsub{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding-block:14px}
.confirm{border:2px solid var(--ink);border-radius:10px;padding:16px 18px;display:grid;gap:10px;margin-top:14px}
.tabs{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:var(--page);padding:7px 14px;font-weight:700;font-size:15px}
.tabs button + button{border-left:1.5px solid var(--ink)}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
@media (max-width:820px){.xgrid{grid-template-columns:1fr}}
.xnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:14px}
.flagon{background:var(--hl);border-color:var(--hl)}
.map{border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
@media (max-width:820px){.map{position:static}}
.mapg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.mapg button{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--soft);background:var(--page);font-size:13.5px;font-weight:700;padding:0;position:relative;color:var(--ink)}
.mapg button.ans{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.mapg button.cur{outline:3px solid var(--ink);outline-offset:2px}
.mapg button.fl{box-shadow:0 0 0 4px var(--hl)}
.key{font-size:14px;color:var(--soft);display:grid;gap:2px}
.task{display:grid;gap:16px;min-width:0}
.scen{background:var(--wash);border-radius:8px;padding:14px 16px;display:grid;gap:10px;overflow-x:auto;max-width:72ch}
.part{display:grid;gap:8px;padding-top:16px;border-top:1px solid var(--rule)}
.part textarea{font:inherit;font-size:16px;width:100%;min-height:104px;background:var(--page);color:var(--ink);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;resize:vertical}
.part textarea:focus{border-color:var(--pen)}
.part textarea.code{font-family:var(--f-code);font-size:14px;tab-size:4}
.selfmark{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.selfmark button{border:1.5px solid var(--rule);background:var(--page);border-radius:8px;padding:6px 12px;font-size:14.5px;font-weight:700}
.selfmark button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.result{border:2px solid var(--ink);border-radius:10px;padding:20px;display:grid;gap:10px;margin-top:16px}
.score{font-family:var(--f-read);font-size:clamp(40px,8vw,54px);font-weight:600;line-height:1}
.score small{font-size:.42em;font-weight:400;color:var(--soft)}
.kbd{font-size:13.5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <div class="top">
    <button class="brand" id="home" aria-label="Back to all stops">IJAIO Reviewer</button>
    <div class="seg" role="group" aria-label="Choose your level">
      <button data-track="up">Years 4–6</button>
      <button data-track="ls">Years 7–8</button>
    </div>
  </div>
  <main id="main"></main>
</div>
<script>
/* ===== Official IJAIO 2026 specimen papers (computing.sg/ijaio), Problem Sets A and B =====
   MCQ: [tag, question, [options], answerIndex, explanation, byHandLine?]
   tags: fp = First Principles, genai = Generative AI, agent = AI Agent, ethics = AI Ethics, byhand = By hand */
const OFFICIAL = {
up:{
 A:{name:"Official Paper A · Standard", mcq:[
  ["genai","What can <b>generative AI</b> do that a normal calculator cannot?",["create brand-new text, images or music","add a long list of numbers","work out long sums very fast","show the answer on a small screen"],0,"<b>Generative AI</b> produces brand-new content based on patterns it learned; the other options are ordinary computer tasks."],
  ["genai","You want a clearer answer from a chatbot. Which change to your typed request (your prompt) helps most?",["repeat the same request several times","add a role, a clear task and a limit","make the request as short as possible","write the whole request in capitals"],1,"A <b>prompt</b> works best with a role, a specific task and a constraint; vague prompts give vague answers."],
  ["genai","A chatbot like a Large Language Model mainly works by…",["storing every possible answer in a database","following a fixed set of grammar rules","searching the live web for each reply","predicting the next likely word, step by step"],3,"An LLM <b>predicts the next word</b> again and again, using patterns from huge amounts of text."],
  ["fp","AI systems learn their skills mainly from…",["a single built-in fixed rule","random guessing each time","advice from one human expert","lots of example data"],3,"AI learns patterns from <b>training data</b>. The data shapes what it can and cannot do."],
  ["fp","An AI turns words into number-lists (vectors) so that words with similar meanings get…",["completely random numbers","the same number as every other word","similar numbers, sitting close together","no numbers at all"],2,"Similar meanings get <b>similar numbers</b>: the idea behind embeddings."],
  ["fp","To sort fruit photos into groups when no names are given, the AI looks for…",["shared features such as colour and shape","the name of the photographer","the date each file was saved","the order they were uploaded"],0,"Grouping by <b>shared features</b> is how unlabelled data is organised."],
  ["fp","A robot dog earns a point each time it takes a step without falling, and loses a point when it falls. After many tries it walks smoothly. How did it learn?",["by copying a rule book written by its makers","by memorising a video of another robot walking","by asking its owner before every single step","by trial and error, keeping the actions that earned rewards"],3,"Learning from <b>rewards by trial and error</b> is called <b>reinforcement learning</b>. Moves that earn points get repeated; moves that lose points get dropped."],
  ["ethics","A shocking video shows a real politician saying something they never said; it was AI-made. Before reacting, the wise step is to…",["share it immediately so others see it","check whether it is a genuine clip from a trusted source","assume it is real because it looks real","add your own caption and repost it"],1,"AI-made fakes of real people (<b>deepfakes</b>) can look convincing; verify with trusted sources before believing or sharing."],
  ["fp","You sketch an AI “homework checker”. A sensible FAILURE to plan for, with a fix, is…",["it confuses two pupils' similar handwriting; fix: ban handwriting","it works slowly at busy times; fix: skip the checking step","it marks a messy but correct answer wrong; fix: allow human review","it needs many example answers; fix: train it on none"],2,"Naming a likely <b>failure</b> and a <b>fix</b> (human review) is good design."],
  ["ethics","You use AI to make a picture, then enter it in an art contest as if you drew it yourself. This is mainly a problem of…",["the image resolution chosen","the colour balance settings","honesty and giving credit","the saved file format"],2,"Being <b>honest</b> about AI's help matters. Claiming AI work as fully your own is unfair to others."],
  ["byhand","These examples follow one rule. Work out the rule, then give the output for 10.",["19","21","20","11"],0,"Each output is double the input minus one (2→3, 3→5, 4→7), so 10→<b>19</b>. Inferring a rule from examples and applying it to a new input is the core idea behind machine learning.","2 → 3 &nbsp;&nbsp; 3 → 5 &nbsp;&nbsp; 4 → 7 &nbsp;&nbsp; 10 → <b>?</b>"],
  ["byhand","Follow the rules. RULE 1: if a word has the letter ‘z’, score 2. RULE 2: if it is longer than 4 letters, score 1. Word: “pizza”. Total score?",["2","4","1","3"],3,"2 + 1 = <b>3</b>. Adding up rule points step by step is how a simple AI scores things.","“pizza” → has ‘z’ (+2) and 5 letters (+1)"],
  ["agent","An <b>AI agent</b> is different from a plain chatbot because it can…",["store far more of your past conversations","reply with much longer, more detailed messages","run without needing any electricity at all","plan steps and use tools to reach a goal"],3,"An <b>agent</b> plans, takes actions and can use tools (like searching or a calculator) to finish a task."],
  ["ethics","Which is the SAFEST thing to paste into a public chatbot?",["Your friend’s home address","A made-up practice question","A family member’s password","A classmate’s medical note"],1,"Never share <b>private information</b> about yourself or others. Made-up practice content is fine."],
  ["ethics","Before trusting an important fact from AI, you should…",["repeat it so you remember it","share it with your classmates","check it against a reliable source","save it as a screenshot"],2,"AI can be wrong, so <b>verify important facts</b> with a trusted source."],
  ["genai","What is the difference between <b>classifying</b> and <b>generating</b>?",["Classifying sorts items; generating makes new content","Both simply mean creating brand-new pictures","Classifying writes text while generating deletes it","They are two different names for the same thing"],0,"<b>Classification</b> labels or sorts existing things; <b>generation</b> creates new things."],
  ["genai","Which prompt is likely to give the BEST result?",["“Write a poem about an animal.”","“Make a cat poem, any length is fine.”","“Do a nice poem for me, please and thanks.”","“Write a funny 4-line poem about a sleepy cat.”"],3,"A <b>specific, clear prompt</b> (topic, length, style, audience) gives better results than a vague one."],
  ["ethics","Some artists are upset that AI learned from their drawings without asking. This is a debate about…",["fairness and consent for training data","the layout of the app's menus","the speed of the internet","which file format to use"],0,"Who owns the data AI learns from, and whether <b>permission</b> was given, is a real ethical debate."],
  ["genai","Does a chatbot truly “understand” your words the way a human friend does?",["Yes, exactly like a human friend does","Yes, it genuinely feels real emotions","No, it only predicts language patterns","Only for very simple, everyday questions"],2,"AI matches <b>patterns</b> in language. It does not understand or feel as people do."],
  ["ethics","Which of these is a real-world cost of training a big AI model?",["it wears out the user's keyboard","it uses large amounts of electricity and water","it uses up the internet's words","it makes other computers run slower worldwide"],1,"Big models run in data centres that use a lot of <b>electricity and cooling water</b>: a real cost someone pays."],
  ["ethics","You read an amazing online story “written by a student.” A clue it might be AI-made is that it…",["was posted on the site fairly recently","is neatly divided into several paragraphs","has a clear, descriptive title at the top","is polished yet gets simple facts wrong"],3,"AI text can read smoothly yet contain <b>made-up facts</b> or a generic tone. Stay curious and check."],
  ["byhand","A tiny “points machine” decides if an email is spam. +3 if it says “free prize”, +2 if it has many links, −1 if from a known friend. Email: “FREE PRIZE!! click these links” from a stranger. Score?",["4","5","3","6"],1,"3 + 2 = <b>5</b>. A higher score means “more likely spam.” You computed a simple model yourself.","RULES: +3 “free prize” · +2 many links · −1 known friend"],
  ["ethics","You have checked carefully and are now SURE a shocking video of a classmate is an AI-made fake. The responsible next step is to…",["repost it with a warning caption","report it to a trusted adult or the platform","keep a copy to show friends later","do nothing; fakes are harmless"],1,"When you find a harmful fake, <b>report it</b> so it can be taken down. Spreading it further, even with a warning, still increases the harm."],
  ["genai","Generative AI can also help programmers by…",["guaranteeing the code has no mistakes","finding every bug with no human checking","drafting code for a person to check and test","running finished code faster"],2,"AI can <b>draft code</b>, but humans must still check and test it."],
  ["agent","When a voice assistant hears you speak, turning the sound into words it can work with happens in its…",["acting step","sensing step","reward step","sleeping step"],1,"Hearing and converting your speech is the agent's <b>sense</b> step: input first, then think, then act."],
  ["ethics","Who often prepares the labelled examples that AI learns from?",["the model invents all labels itself","people who label the data manually","labels are copied automatically online","no labels are needed at all"],1,"<b>People label data</b> (e.g. “this is a cat”), so human choices shape the AI."],
  ["ethics","Your friend wants to ask a chatbot for medical advice about a real illness. The wisest thing is to…",["fully trust the chatbot’s diagnosis","see a doctor; AI is not a substitute","ask it exactly which medicine to take","just wait and see if it passes on its own"],1,"For health, money or safety, rely on <b>qualified people</b>. AI can give wrong or unsafe answers."],
  ["ethics","A GOOD use of AI that helps people is…",["describing images for the blind","writing fake product reviews for money","automatically liking all your own posts","secretly copying answers during a test"],0,"AI can <b>improve accessibility</b>, such as describing images for blind users."],
  ["ethics","A face-recognition tool works well for some people but makes more mistakes for others. This shows the importance of…",["using much higher-resolution cameras","training the staff to type much faster","adding several more display screens","testing AI for fairness"],3,"AI should be <b>tested for fairness</b> so it does not disadvantage some groups."],
  ["ethics","The most responsible way to use generative AI for schoolwork is to…",["hand in its output as if it were your own work","use it but never bother to fact-check what it says","learn from it, then verify","let it complete your entire exam for you"],2,"Responsible use = <b>learn, verify, and be honest</b> about AI's help."]

 tasks:[
  {title:"Task 1 · Build a “Points Machine” from First Principles", marks:20,
   scenario:`A school wants a simple AI to flag <b>possibly unkind messages</b> for a teacher to check. The “points machine” gives each message a score:<br>• +3 if it contains a mean name<br>• +2 if it is in ALL CAPITAL LETTERS<br>• +1 if it has 3 or more “!”<br>• −2 if the sender often sends kind messages<br><br>Flag a message if the score is <b>3 or more</b>.`,
   parts:[
    {q:"a) Score this message from a usually-kind sender: “YOU ARE A LOSER!!!” Show your working.", marks:8, model:"+3 (mean name “loser”) +2 (ALL CAPS) +1 (three “!”) −2 (kind sender) = <b>4</b>. (2 marks per correct rule applied.)"},
    {q:"b) Should the message be flagged? Explain using your score.", marks:4, model:"Yes: 4 is ≥ 3, so it is flagged for a teacher to look at."},
    {q:"c) The machine flags a message that was actually a joke between best friends. Why can a simple rule machine make this mistake, and why should a human still check before anyone is punished?", marks:8, model:"The machine only counts words, CAPS and “!”; it cannot understand tone, friendship or jokes (context). So it gives <b>false positives</b>. A human should make the final call so no one is unfairly punished by a rule that missed the meaning."}
   ]},
  {title:"Task 2 · Design a Responsible Homework-Helper Agent", marks:20,
   scenario:`An <b>AI agent</b> can <b>sense</b> a request, <b>plan</b> steps, <b>use tools</b> (like a calculator or web search), and <b>act</b> to help reach a goal.<br><br>Design a generative-AI “study buddy” agent whose goal is to help a Grade 5 student <b>learn</b>, not to do the work for them.`,
   parts:[
    {q:"a) List two tools your agent could use and what each is for.", marks:4, model:"Any two sensible tools, e.g. a calculator (to check arithmetic) and a search or reference tool (to find an explanation or example). 2 marks each."},
    {q:"b) Write the agent’s plan as 3–4 steps for helping with a maths question (sense → plan → act).", marks:8, model:"e.g. 1) Sense: read the question. 2) Plan: break it into steps. 3) Act: guide the student with hints and one worked example. 4) Check the student’s answer and give feedback. 2 marks per clear stage."},
    {q:"c) Dilemma: The student types, “Just give me all the answers to my graded test so I can copy them.” What should a responsible study-buddy do and say, and why?", marks:8, model:"It should <b>decline</b> to hand over graded-test answers and explain why (it would be cheating and stop real learning). Then it offers to teach the method, give practice questions or hints. Good answers mention honesty / academic integrity and that the helper's goal is learning."}
   ]}
 ]},
 B:{name:"Official Paper B · Generative AI", mcq:[
  ["fp","A child sorts [shark, goldfish, eagle, sparrow] into two groups. The most useful FEATURE to group them by is…",["whether its name is long or short","whether it mainly swims or flies","which animal you like best","the order they were listed in"],1,"Grouping by a <b>shared feature</b> (swims vs flies) makes meaningful groups, the idea behind how AI organises data."],
  ["genai","Your first AI image of “a cat” looks too plain. The BEST next step to improve it is to…",["press generate again with the very same words","add detail to your prompt, e.g. “a fluffy ginger cat in a hat, cartoon style”","type the word CAT in capitals","give it no words at all"],1,"You <b>create and then refine</b> by improving the <b>prompt</b> with useful detail."],
  ["fp","A computer turns words into number-lists so similar meanings get similar numbers. Which PAIR should be CLOSEST?",["cat and car","cat and Tuesday","cat and kitten","cat and bicycle"],2,"“cat” and “kitten” mean almost the same thing, so their number-lists (<b>embeddings</b>) sit closest."],
  ["agent","You design an AI “lost-property helper” that photographs an item and names its owner. A likely FAILURE to plan for, and a fix, is…",["it works slowly at busy times; fix: skip the owner check","it shows the photo too small; fix: ignore any mistakes","it needs many photos to learn; fix: train it on none","it confuses two look-alike bags; fix: have a person confirm first"],3,"Good design names a likely <b>failure case</b> and a sensible <b>fix</b> (here, human confirmation)."],
  ["genai","Which prompt is most likely to get a useful answer?",["“Explain why the sky is blue in 3 sentences, for a 10-year-old.”","“Tell me everything you know about the sky.”","“Why is the sky blue? Explain fast and in full detail.”","“Write the longest, most detailed report you can on the sky and space.”"],0,"The best prompt sets a clear task, an <b>audience</b> and a <b>limit</b>; the others are too broad or contradict themselves."],
  ["ethics","You ask an AI for a fact and it gives a confident answer with a made-up book as the source. You should…",["Use it as-is, since it provided a source","Verify the fact and source before using it","Trust it because the answer sounds confident","Submit it as your own without checking"],1,"AI can hallucinate facts <b>and</b> fake sources. Verify before using, and acknowledge AI help."],
  ["fp","A chatbot writes “The dog chased the…” and then picks “ball”. Why “ball”?",["it is the shortest word available","a person typed it in secretly","“ball” often followed those words in its training text","it checked a dictionary of endings"],2,"The model picks the <b>most likely next word</b> using patterns from its training text."],
  ["fp","A cat-spotter AI correctly labels a NEW cat photo it never saw in training. This ability is called…",["memorising","copying","generalisation","labelling"],2,"<b>Generalisation</b> is working correctly on new, unseen examples: the whole point of learning from data."],
  ["fp","An artificial “neuron” adds up its inputs and passes on a signal. When many are connected into a network, together they can…",["store each fact in a fixed list","learn patterns from many examples","follow one rule a person wrote","work without ever seeing any data"],1,"A <b>neural network</b> of many simple neurons <b>learns patterns from data</b>."],
  ["genai","Adding “You are a science teacher” to the start of your prompt gives the AI a…",["password","picture","score","role"],3,"Setting a <b>role</b> shapes the style and level of the answer."],
  ["ethics","Why should you not trust everything a chatbot says?",["It never makes any mistakes","It is wrong about almost everything it says","It can confidently make things up","It only ever tells jokes"],2,"Chatbots can <b>hallucinate</b>: sound confident yet be wrong."],
  ["ethics","A face-unlock trained mostly on adult faces is most likely to struggle with…",["bright sunny weather outdoors","children's faces","fast typing","loud rooms"],1,"Unrepresentative training data causes <b>bias</b>: weaker results for groups missing from the data."],
  ["agent","An AI assistant asked for today's news should…",["guess from its old training","make up a likely headline","fetch it from a live source","stay completely silent"],2,"Live facts must come from a <b>tool or live source</b>; training data is fixed in the past."],
  ["genai","You want a chatbot to give almost the SAME answer every time you ask. You should turn its ‘randomness dial’ (temperature)…",["up to maximum","down low","off and on quickly","to a random setting"],1,"A low <b>temperature</b> makes the model stick to its most likely words, so answers become steadier."],
  ["fp","An AI learns to sort spam email mainly by…",["finding patterns in many examples","politely asking the sender to confirm","reading the user's mind","guessing with no information"],0,"It is <b>trained on examples</b> of spam and not-spam to learn the patterns."],
  ["ethics","If AI helped you with a school project, the honest thing is to…",["hide that you used it","say that you used AI","claim you wrote it all","delete the whole project"],1,"Acknowledging AI help is <b>responsible and honest</b> use."],
  ["ethics","Before sharing a chat with an AI, you should avoid including your…",["favourite colour","maths homework","password and home address","favourite day of the week"],2,"Never share <b>private information</b> like passwords or your address."],
  ["fp","An AI is shown these input→output examples and must learn the rule, then apply it to a new input.",["14","15","13","8"],1,"Each output is <b>double the input, plus one</b> (2→5, 3→7, 4→9), so 7→<b>15</b>. Finding a rule that fits the examples and still works on new inputs is the heart of machine learning.","2 → 5 &nbsp;&nbsp; 3 → 7 &nbsp;&nbsp; 4 → 9 &nbsp;&nbsp; 7 → <b>?</b>"],
  ["fp","An app must sort incoming photos into “cat” and “not cat”. To get good at this sorting, what does it most need?",["many labelled example photos to learn from","one perfect photo of a cat to copy","a written list of rules about cats","its photos sorted alphabetically by name"],0,"A classifier learns from <b>many labelled examples</b>; their variety and quality decide how well it sorts."],
  ["fp","A self-driving toy car “sees” the road using…",["a map memorised in advance","sensors such as cameras","spoken directions from a person","a guess about the road ahead"],1,"<b>Sensors</b> (like cameras) let a machine perceive the world."],
  ["fp","Predictive text on a phone suggests the next word by…",["reading your private emails out aloud","choosing words at random","guessing the most likely next word","using the phone camera"],2,"It predicts the <b>most likely next word</b>: the same idea behind chatbots."],
  ["fp","An AI chatbot does NOT actually…",["join words up into proper sentences","make mistakes","use words","understand feelings like a person"],3,"Chatbots produce language but do not truly <b>understand or feel</b>."],
  ["genai","A drawing AI begins with random speckles and then…",["removes the noise to form an image","keeps adding even more noise forever","prints the speckles out","deletes the whole file"],0,"Diffusion <b>removes noise step by step</b> to reveal the picture."],
  ["genai","Which request will likely get a more useful drawing from an art AI?",["just one short single vague word","a clear, detailed description","a row of random symbols","no words at all"],1,"A clear, detailed <b>prompt</b> guides the output."],
  ["ethics","An AI marks neat handwriting higher than messy but correct answers. This is…",["unfair bias against messy writing","fair and accurate marking","a small rounding error","a privacy problem"],0,"Judging style over correctness is <b>unfair bias</b>."],
  ["fp","To teach an AI to recognise many breeds of dog, you should train it on…",["one dog photographed often","only pictures of cats","no pictures at all","many different dog breeds"],3,"Varied, representative <b>data</b> helps it generalise."],
  ["agent","An AI agent working toward a goal repeats: sense, then think, then…",["act","sleep","delete","wait"],0,"The agent loop is <b>Sense → Think → Act</b>, repeated."],
  ["genai","A chatbot and a search engine differ because the chatbot…",["shows ranked web links","writes a fresh answer","only stores old pages","just counts your clicks"],1,"A chatbot <b>generates</b> a reply; search retrieves existing pages."],
  ["ethics","Training and running a big AI model needs huge computers. A real-world cost of this is…",["just one ordinary home computer","a lot of electricity and water","no energy at all once built","only a little extra storage"],1,"Big AI models use a lot of <b>energy and water</b>: using AI has a real-world cost."],
  ["fp","An AI sorts many animal photos into groups that look alike, without being told any names for the groups. This is…",["grouping similar items with no labels (clustering)","sorting items using labels a person gave","translating the captions to other languages","searching the web for matching photos"],0,"Grouping similar items with <b>no labels given</b> is called <b>clustering</b>."]

 tasks:[
  {title:"Task 1 · Be the Next-Word Predictor", marks:20,
   scenario:`A tiny language model has read many sentences. It counted which words come right after the word “play”:<br><br><b>after “play”: football → 5, piano → 3, games → 2, outside → 2</b>`,
   parts:[
    {q:"a) The model has just written “I want to play …”. Which single word is it MOST likely to pick next? Why?", marks:5, model:"<b>football</b>, because it has the highest count, 5."},
    {q:"b) There were 12 counts in total. Write the chance (as “… out of 12”) that it picks “piano”.", marks:5, model:"<b>3 out of 12</b> (= 1 in 4)."},
    {q:"c) Two children give the exact same prompt and get different next words. Explain how, using the idea that the model sometimes picks from its likely words instead of always the top one.", marks:10, model:"The model can <b>sample</b> from its likely words (a bit of randomness, called “temperature”), so the same prompt can give different words. It is not “broken”. Up to 4 marks for linking this randomness to why a chatbot feels fresh each time."}
   ]},
  {title:"Task 2 · Prompt Detective & Fact-Checker", marks:20,
   scenario:`Maya types this weak prompt into a chatbot: <i>“tell me about volcanoes”</i>. The chatbot replies with a long answer that includes the “fact” that the world’s tallest volcano is in Singapore.`,
   parts:[
    {q:"a) Rewrite Maya’s prompt so it is clear and useful. Include a role, a clear instruction, and one constraint (length or audience).", marks:8, model:"A clearly improved prompt, e.g. “You are a geography teacher. Explain in 4 sentences for a 10-year-old how volcanoes erupt.”"},
    {q:"b) The “fact” about Singapore is wrong. What is this kind of confident-but-false AI answer called, and what should Maya do before using it?", marks:6, model:"It is a <b>hallucination</b>. Check it against a reliable source (atlas, encyclopaedia) before using it."},
    {q:"c) Maya uses the answer in a project. Write one sentence she should add to be honest about how she used AI.", marks:6, model:"e.g. “I used an AI chatbot to help explain volcanoes and checked the facts in an atlas.”"}
   ]}
 ]}
},
ls:{
 A:{name:"Official Paper A · Standard", mcq:[
  ["fp","To a computer, a photo is really a grid of…",["numbers (one or more per pixel)","letters, one per object","short text labels describing it","recorded sound waves"],0,"An image is a <b>grid of number-pixels</b>: the start of computer vision."],
  ["fp","A model splits your sentence into sub-word pieces before processing. A practical consequence of working on these pieces (not letters) is that the model…",["can miscount the letters in a word","always spells perfectly","reads one character at a time","cannot handle any new words"],0,"Working on <b>tokens</b> (sub-word pieces) explains why a model can miscount letters or mis-split rare words."],
  ["genai","Raising the <b>temperature</b> setting of a generative model usually makes its output…",["more factually accurate","strictly shorter in length","more random and varied","faster to generate"],2,"Higher <b>temperature</b> increases randomness and creativity; lower temperature makes output more focused and predictable."],
  ["genai","Word <b>embeddings</b> represent words as vectors so that…",["every single word receives an identical vector","words get directly converted into images","vectors are always limited to two numbers each","words with similar meanings sit close together"],3,"<b>Embeddings</b> place similar meanings near each other, so models can measure how related words are."],
  ["fp","In <b>supervised</b> learning, the training data includes…",["no data at all","labelled correct answers","only the model’s own guesses","unlabelled raw text only"],1,"<b>Supervised</b> learning uses labelled examples; ‘unlabelled’ describes <b>unsupervised</b> learning."],
  ["genai","You want a model to output every answer as a JSON object. Which approach most reliably gets the format right first time?",["Ask once with no examples and hope","Raise the temperature to maximum","Put two or three worked input→output examples in the prompt (few-shot)","Repeat the word JSON many times"],2,"Showing a few worked examples (<b>few-shot prompting</b>) demonstrates the exact format you want."],
  ["genai","Why do LLMs sometimes ‘hallucinate’ (state false things confidently)?",["they optimise for plausible text, not verified truth","they are deliberately trying to deceive the user","they have simply run low on memory","they copy their answers directly from Wikipedia articles"],0,"Models optimise for <b>plausible-sounding</b> text, not truth, so they can produce convincing errors."],
  ["genai","In “The cup fell off the table and it broke,” a transformer works out that “it” = the cup by…",["using attention to weigh the other words","counting the letters","raising its temperature","translating the sentence"],0,"<b>Attention</b> lets the model weigh which other words matter when working out a word."],
  ["agent","An agent is asked for today's live exchange rate. At which step must it call a tool?",["when it needs a fact it cannot know from training, to fetch the live rate","never; it should always guess","only at the very end, to format the text","only to translate the answer"],0,"A <b>tool call</b> is needed exactly where the agent needs live or external information."],
  ["genai","Compared with writing a clever prompt, <b>fine-tuning</b> a model means…",["editing the prompt wording only","training it further on extra examples","restarting the model’s server","caching its previous responses"],1,"<b>Fine-tuning</b> updates the model’s weights with new data; prompting only changes the input."],
  ["agent","An <b>AI agent</b> typically works in a loop of…",["send request → wait → return one single reply","encode → store → then forget the result","think → act (tool) → observe → repeat","compile → run → then exit the program"],2,"Agents repeat: reason, take an action or tool call, read the result, and continue until the goal is met."],
  ["byhand","A single neuron computes <code>output = (w₁·x₁)+(w₂·x₂)+b</code>. With x₁=2, x₂=3, w₁=1, w₂=2, b=−1, the output is…",["6","7","8","11"],1,"2 + 6 − 1 = <b>7</b>. This weighted sum plus bias is the core operation inside every neural network.","(1×2) + (2×3) + (−1) = ?"],
  ["ethics","A realistic AI-generated video of a real person saying things they never said is a deepfake. A technical defence against this is…",["raising the video resolution","compressing the file further","adding background music","content provenance / watermarking"],3,"<b>Provenance and watermarking</b> help prove whether media is authentic or AI-generated."],
  ["fp","A model scores 99% on its training data but fails on new data. This is…",["underfitting","overfitting","reinforcement learning","tokenisation"],1,"<b>Overfitting</b> means the model memorised the training set instead of learning general patterns."],
  ["ethics","An automatic moderation AI wrongly removes a harmless post (a false positive). The best response is to…",["permanently ban the poster","delete all similar posts too","provide a human appeal process","lower the threshold to zero"],2,"Automated systems make mistakes; a <b>human appeal route</b> protects people from unfair errors."],
  ["genai","Most modern AI image generators are based on…",["diffusion models","decision trees","hash tables","linear regression"],0,"<b>Diffusion models</b> start from random noise and denoise step by step into an image."],
  ["ethics","Pasting a classmate’s private medical details into a public AI chatbot is risky mainly because…",["it slightly slows down the assistant’s overall response time","it noticeably raises the compute cost","it can confuse the model’s text tokenizer","it can expose personal data that is stored or leaked"],3,"Sharing others’ <b>personal data</b> can break privacy, and the service may keep it."],
  ["fp","We test a model on data it never saw in training in order to…",["make the whole training process run faster","shrink the final model’s size on disk","measure how it generalises","change the trained model’s output style"],2,"A held-out <b>test set</b> measures real generalisation, not memorisation."],
  ["ethics","The biggest societal risk of cheap, high-quality generative AI text is…",["steadily rising electricity bills for everyday users","mass-produced misinformation","fewer available jobs for graphic designers","more crowded and noisy social media feeds"],1,"Generative AI can mass-produce convincing <b>misinformation</b>, so verification matters more."],
  ["byhand","Build a tiny bigram predictor from this training text: “we play, we win, we play, we sing”. After the word “we”, which word should it predict?",["play (it followed “we” most often)","win","sing","we"],0,"Count the pairs: we→play 2 times, we→win once, we→sing once. A bigram model predicts the <b>most frequent</b> next word: <b>play</b> (2 of 4).","we→play · we→win · we→play · we→sing … after “we” → ?"]
 ],
 tasks:[
  {title:"Task 1 · Trace a Neuron and a Decision", marks:20,
   scenario:`A tiny model decides whether to <b>recommend a video</b>. It is a single neuron:<br><code>z = (w₁·x₁) + (w₂·x₂) + b</code>, then a step activation: <b>recommend if z &gt; 0, else skip</b>.<br><i>(Work out z first. If z is bigger than 0 the neuron switches ON → recommend. If not, it stays OFF → skip.)</i><br><br>Features: x₁ = “matches user’s topic” (1 yes / 0 no), x₂ = “video length in minutes ÷ 10”.<br>Weights: w₁ = 4, w₂ = −1, bias b = 1.`,
   parts:[
    {q:"a) Compute z for Video P: x₁=1, x₂=2. Show working. Is it recommended?", marks:6, model:"z = 4·1 + (−1)·2 + 1 = 4 − 2 + 1 = <b>3</b>. 3 &gt; 0 → <b>Recommend</b>. (4 marks for z, 2 for the decision.)"},
    {q:"b) Compute z for Video Q: x₁=0, x₂=0.5. Show working. Is it recommended?", marks:6, model:"z = 4·0 + (−1)·0.5 + 1 = 0 − 0.5 + 1 = <b>0.5</b>. 0.5 &gt; 0 → <b>Recommend</b>. (4 for z, 2 for the decision.)"},
    {q:"c) In one or two sentences, explain what the negative weight w₂ tells us about how the model treats long videos.", marks:4, model:"A negative w₂ means longer videos <b>lower</b> the score, so the model favours shorter videos."},
    {q:"d) Suggest one risk of recommending purely from such a score, and one improvement.", marks:4, model:"Risk: it ignores quality and accuracy and can create filter bubbles or push only short content. Improvement: add more features, use human feedback, or add variety (a diversity term)."}
   ]},
  {title:"Task 2 · Program a Generative-AI Study Agent (Practical)", marks:20,
   scenario:`Design an <b>AI agent</b> that helps a student revise. It can call these tools:<br><code>search(query)</code> → returns notes · <code>quiz(topic)</code> → returns a practice question · <code>ask_LLM(prompt)</code> → returns generated text.<br>Write your answer as <b>pseudocode</b> (Python-like is fine).`,
   parts:[
    {q:"a) Write a function revise(topic) that searches notes, asks the LLM to summarise them, then gives the student one quiz question. Use the tools above.", marks:7, model:"<pre>def revise(topic):\n    notes = search(topic)\n    summary = ask_LLM(\"Summarise: \" + notes)\n    print(summary)\n    print(quiz(topic))</pre>Marks for calling search, ask_LLM and quiz in a sensible order, passing the topic through."},
    {q:"b) Add a loop so the agent keeps quizzing until the student answers 3 questions correctly. Track the count.", marks:7, model:"<pre>correct = 0\nwhile correct &lt; 3:\n    q = quiz(topic)\n    ans = input(q)\n    if check(ans, q):\n        correct += 1</pre>Marks for a loop, a counter and the right stopping condition."},
    {q:"c) Dilemma: the student types “just tell me the exam answers.” Add a check in your code that refuses this and explains why, while still offering legitimate help. Briefly justify your design.", marks:6, model:"<pre>if \"exam answers\" in request:\n    return \"I can't give graded-test answers - that's cheating. Want practice questions or an explanation instead?\"</pre>Justification: the agent should refuse unethical requests and redirect to legitimate help (a guardrail)."}
   ]},
  {title:"Task 3 · The Deepfake Dilemma (Theory + Ethics)", marks:20,
   scenario:`A student newspaper receives a shocking <b>AI-generated video</b> that appears to show the school principal admitting to cheating in a competition. It could go viral before tomorrow’s big match. The editor must decide what to do tonight.`,
   parts:[

/* Final cheat sheet: [term, one-liner] */
const CHEAT = {
up:[
 ["Computers","Everything is numbers. Pictures = pixels. AI is made by people and has no feelings."],
 ["Embeddings","Similar meanings → similar number-lists → close together (cat ≈ kitten)."],
 ["Tokens","Count words AND punctuation. Long words can split (un | happi | ness)."],
 ["Labels","People add them. Fair data = varied and balanced."],
 ["Rules vs ML","Rules are written by people; ML finds the pattern from examples."],
 ["3 ways to learn","Labels → supervised · groups, no labels → clustering · rewards → reinforcement."],
 ["Find the rule","Try +, then ×, then × and +. Check every example."],
 ["Points machine","Add points (minus signs!), compare with the threshold."],
 ["Generalisation","Working on NEW examples it never saw."],
 ["Chatbot","Predicts the next likely word. Doesn't understand or feel."],
 ["Chance","count out of total (piano 3 out of 12)."],
 ["Temperature","Low = same answer each time. High = varied. Not more correct."],
 ["Diffusion","Starts from noise, removes it step by step."],
 ["Prompt","Role + Instruction + Constraint (+ Example)."],
 ["Generate vs retrieve","Make new vs find existing (search)."],
 ["Agent","Sense → Think → Act; plans and uses tools. Sense comes first."],
 ["Live facts","News, weather, scores → fetch from a live source."],
 ["Hallucination","Confident but wrong, even fake sources → verify."],
 ["Deepfake","Check a trusted source; if harmful, report it, don't repost."],
 ["Privacy","No passwords, addresses, phone numbers or medical notes."],
 ["Honesty","Say you used AI. Don't pass off AI work as yours."],
 ["Planet","Data centres use electricity and cooling water."]
],
ls:[
 ["Pipeline","text → tokens → IDs → embeddings. Repeated token = same ID."],
 ["Letter miscount","Model sees sub-word tokens, not letters."],
 ["Embeddings","Close = similar. king − man + woman ≈ queen. Learned bias."],
 ["Pixels","Grey: w × h. Colour: w × h × 3. 0 black, 255 white."],
 ["Neuron","z = Σ w·x + b, then step / ReLU. Check > or ≥."],
 ["Gates","w = 1, 1: b = −1.5 AND, b = −0.5 OR. No XOR with one neuron."],
 ["Learning","Supervised (labels) · unsupervised (k-means) · reinforcement (rewards) · RLHF (human rankings)."],
 ["kNN","Vote of the k nearest labelled examples."],
 ["Overfitting","Train ≫ test. Fix: more varied data, simpler model, regularisation."],
 ["Metrics","Acc (TP+TN)/all · Prec TP/(TP+FP) · Recall TP/(TP+FN). Don't miss cases → recall."],
 ["n-gram","P(next|w) = count ÷ followers. Tie → sample. Tables explode → neural nets."],
 ["Temperature","Low ≈ greedy, consistent. High = varied. Never more accurate."],
 ["Attention","Weighs other words (“it” = the cup)."],
 ["Diffusion","Noise → image, step by step, guided by the prompt."],

 ["Tool call","Live, external, exact or private info. Never guess from training."],
 ["RAG","Retrieve the relevant text first, then answer."],
 ["Guardrail","Refuse harmful requests, redirect to real help. Tool fails → say so."],
 ["Hallucination","Optimises plausibility, not truth."],
 ["Deepfakes","Defence: provenance / watermarking. Biggest risk: mass misinformation."],
 ["Safeguards","Human appeal, oversight, testing every group, labels on AI content."]

/* ===== App ===== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("ijaio2:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("ijaio2:"+k, JSON.stringify(v)); }catch(e){} }
};
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET = "ABCD";
const main = $("#main");

const S = { track: store.get("track","ls"), view:"route", step:null };
const hsh = location.hash.replace("#","");
if (hsh === "up" || hsh === "ls") S.track = hsh;
let exam = null, timer = null, afterRender = null;

const T = () => TRACKS[S.track];
const route = () => ROUTE[S.track];
const doneSet = () => new Set(store.get("done:"+S.track, []));
function markDone(id){ const d = doneSet(); d.add(id); store.set("done:"+S.track, [...d]); }
const mistakes = () => store.get("mist:"+S.track, {});
function addMistake(id, item){ const m = mistakes(); m[id] = item; store.set("mist:"+S.track, m); }
function removeMistake(id){ const m = mistakes(); delete m[id]; store.set("mist:"+S.track, m); }
const stepIndex = id => route().findIndex(s => s.id === id);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function go(view, step){
  stopTimer();
  S.view = view; S.step = step || null;
  render(); window.scrollTo({top:0});
}
function setTrack(t){
  if (S.view === "exam" && exam && !exam.submitted) return;
  S.track = t; store.set("track", t); exam = null;
  go("route");
}
$$("[data-track]").forEach(b => b.addEventListener("click", () => setTrack(b.dataset.track)));
$("#home").addEventListener("click", () => {
  if (S.view === "exam" && exam && !exam.submitted){ exam.confirm = "leave"; renderExam(); window.scrollTo({top:0}); return; }
  go("route");
});

function render(){
  $(".seg").hidden = !!(S.view === "exam" && exam && !exam.submitted);
  $$("[data-track]").forEach(b => b.setAttribute("aria-pressed", b.dataset.track === S.track));
  if (S.view === "route") renderRoute();
  else if (S.view === "step") renderStep();
  else renderExam();
}

/* ---------- ROUTE ---------- */
function renderRoute(){
  const R = route(), d = doneSet(), t = T();
  const core = R.filter(s => s.when !== "bonus");
  const doneCore = core.filter(s => d.has(s.id)).length;
  const next = R.find(s => !d.has(s.id) && s.when !== "bonus") || R.find(s => !d.has(s.id));
  const nm = Object.keys(mistakes()).length;
  const legs = [["tonight","Tonight","About 80 minutes"],["morning","Tomorrow morning","10 minutes before you leave home"],["bonus","If you have time","Extra practice"]];
  let html = `<section class="hero">
    <p class="when">Monday 5 October, 9:30 AM, in the ICT room</p>
    <h1>Get ready for the AI Olympiad</h1>
    <p class="lede">${t.label} test (${t.who}): ${t.minutes} minutes, ${t.mcqCount} multiple-choice questions and ${S.track==="up"?"2":"3"} written tasks, done online. Work through the stops in order. Each one is short, and the last one tonight is the real specimen paper.</p>
    ${next ? `<div class="next"><div><span class="label">${d.size ? "Next stop" : "Start here"}</span><b style="display:block">${stepIndex(next.id)+1}. ${next.title}</b><span class="soft">${next.min} minutes</span></div><button class="btn primary" data-open="${next.id}">${d.size ? "Continue" : "Start"}</button></div>`
           : `<div class="next"><div><span class="label">All stops done</span><b style="display:block">Well done. Sit a paper again or clear your mistakes.</b></div><button class="btn primary" data-open="fix">Fix my mistakes (${nm})</button></div>`}
    <div><span class="score-line">${doneCore} of ${core.length} stops done</span><div class="bar"><div style="width:${doneCore/core.length*100}%"></div></div></div>
  </section>`;
  legs.forEach(([key, title, note]) => {
    const stops = R.map((s,i)=>[s,i]).filter(([s]) => s.when === key);
    if (!stops.length) return;
    html += `<section class="leg"><header><h2>${title}</h2><span class="soft">${note}</span></header><ol class="stops">`;
    stops.forEach(([s,i]) => {
      const isDone = d.has(s.id), here = next && next.id === s.id;
      const extra = s.kind === "fix" && nm ? ` (${nm} saved)` : "";
      html += `<li class="stop${isDone?" done":""}${here?" here":""}"><button class="stopbtn" data-open="${s.id}">
        <span class="mnum" aria-hidden="true">${isDone?"✓":i+1}</span>
        <span><b>${s.title}</b><small>${s.sub}${extra}</small></span>
        <span class="r">${isDone ? "Done" : here ? "Next" : s.min + " min"}</span></button></li>`;
    });
    html += `</ol></section>`;
  });
  main.innerHTML = html;
  $$("[data-open]").forEach(b => b.addEventListener("click", () => go("step", b.dataset.open)));
}

/* ---------- STEP PAGES ---------- */
function stepHead(st){
  return `<div class="crumb"><button class="linkback" data-back>All stops</button></div>
  <header class="stephead sheet"><span class="mnum">${stepIndex(st.id)+1}</span><h1>${st.title}</h1><p>${st.sub}. About ${st.min} minutes.</p></header>`;
}
function stepFoot(st){
  const nx = route()[stepIndex(st.id)+1];
  if (st.kind === "paper") return `<div class="stepfoot"><button class="btn" data-back>All stops</button>${nx ? `<button class="btn" data-skip="${nx.id}">Skip to ${nx.title}</button>` : ""}</div>`;
  return `<div class="stepfoot"><button class="btn" data-back>All stops</button>
    ${nx ? `<button class="btn primary" data-done="${st.id}" data-next="${nx.id}">Done. Next: ${nx.title}</button>` : `<button class="btn primary" data-done="${st.id}">Done</button>`}</div>`;
}
function renderStep(){
  const st = route().find(s => s.id === S.step);
  if (!st){ go("route"); return; }
  const body = ({brief, sprint, clinic, python, secb, paper:paperLanding, fix, cheat})[st.kind](st);
  main.innerHTML = stepHead(st) + `<div class="sheet">${body}</div>` + stepFoot(st);
  $$("[data-back]").forEach(b => b.addEventListener("click", () => go("route")));
  $$("[data-skip]").forEach(b => b.addEventListener("click", () => go("step", b.dataset.skip)));
  $$("[data-done]").forEach(b => b.addEventListener("click", () => { markDone(b.dataset.done); b.dataset.next ? go("step", b.dataset.next) : go("route"); }));
  if (afterRender){ const f = afterRender; afterRender = null; f(); }
}

/* questions */
function mix(item){
  const idx = item[1].map((_,i)=>i);
  for (let i = idx.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return [item[0], idx.map(i=>item[1][i]), idx.indexOf(item[2]), item[3]];
}
function qHTML(id, item, label){
  return `<div class="q" data-qid="${esc(id)}"><div class="qhead"><span class="label" data-qlabel>${label}</span></div><div class="qtext">${item[0]}</div>
  <div class="opts">${item[1].map((o,k)=>`<button class="opt" data-k="${k}"><span class="bub">${LET[k]}</span><span>${o}</span></button>`).join("")}</div><div class="whybox" aria-live="polite"></div></div>`;
}
function wireQs(scope, items, src, onAns){
  $$("[data-qid]", scope).forEach(el => {
    const it = items.find(x => x.id === el.dataset.qid); if (!it) return;
    $$(".opt", el).forEach(b => b.addEventListener("click", () => {
      const k = +b.dataset.k, ok = k === it.item[2];
      $$(".opt", el).forEach((o,j) => { o.disabled = true; if (j === it.item[2]) o.classList.add("right"); else if (j === k) o.classList.add("wrong"); });
      $(".whybox", el).innerHTML = `<p class="why ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b>${it.item[3]}</p>`;
      if (!ok) addMistake(it.id, {q:it.item[0], o:it.item[1], a:it.item[2], e:it.item[3], src});
      if (onAns) onAns(ok, it, el);
    }));
  });
}
function quizBlock(title, items, src){
  afterRender = () => {
    const scope = $("#quiz"); if (!scope) return;
    let n = 0, r = 0;
    wireQs(scope, items, src, ok => { n++; if (ok) r++; $("#tally").textContent = `${r} right out of ${n} answered. ${n < items.length ? plural(items.length - n, "question") + " to go." : "All done."}`; });
  };
  return `<section class="block" id="quiz"><h2>${title}</h2><p class="score-line" id="tally" aria-live="polite">${plural(items.length,"question")}. Wrong answers are saved for later.</p>
    ${items.map((x,i)=>qHTML(x.id, x.item, `Question ${i+1} of ${items.length}`)).join("")}</section>`;
}

function brief(st){
  const t = T();
  return `<section class="block"><h2>The paper</h2>
    <div class="facts">${t.spec.map(s=>`<span><b>${s[0]}</b>${s[1]}</span>`).join("")}</div>
    <p class="intro">You sit it on Monday 5 October at 9:30 AM in the ICT room, online on a school computer. The organisers run the session. ${S.track==="ls"?"The rules allow Python 3 in Jupyter or Google Colab for the practical task, and pseudocode is accepted.":""}</p></section>
  <section class="block"><h2>Your timing plan</h2><div class="tablewrap"><table class="plan"><thead><tr><th>Part</th><th>Time</th><th>How</th></tr></thead><tbody>
    ${t.pace.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td class="soft">${p[2]}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="block"><h2>Golden rules</h2><ul class="list">${GOLDEN[S.track].map(g=>`<li><b>${g[0]}</b><span class="soft">${g[1]}</span></li>`).join("")}</ul></section>`;
}

function sprint(st){
  const sp = SPRINTS[S.track][st.p];
  const items = sp.quick.map((q,i)=>({id:`${S.track}:${st.p}:${i}`, item:mix(q)}));
  return `<section class="block"><h2>Must-know facts</h2><p class="intro">Read each one out loud, then cover it and say it again in your own words.</p>
    <div>${sp.cards.map(c=>`<div class="fact"><h3>${c.h}</h3><p class="rule">${c.rule}</p>${c.hook?`<p class="hook">Remember it like this: ${c.hook}</p>`:""}${c.ex?`<div class="ex">${c.ex}</div>`:""}${c.trap?`<p class="trap"><span class="hl"><b>Exam trap:</b>${c.trap}</span></p>`:""}</div>`).join("")}</div>
  </section>` + quizBlock("Quick fire", items, PILLARS[st.p].name);
}

function clinic(st){
  const all = [];
  let html = `<p class="intro" style="margin-bottom:24px">These questions reward careful working. Follow the steps on scrap paper, one line at a time, then answer.</p>`;
  CLINIC[S.track].forEach((sk, si) => {
    const items = sk.qs.map((q,i)=>({id:`${S.track}:clinic:${si}:${i}`, item:mix(q)}));
    all.push(...items);
    html += `<section class="block"><h2>${sk.h}</h2><ol class="recipe">${sk.recipe.map(r=>`<li>${r}</li>`).join("")}</ol>
      ${items.map((x,i)=>qHTML(x.id, x.item, `Practice ${i+1} of ${items.length}`)).join("")}</section>`;
  });
  afterRender = () => wireQs(main, all, "By-hand clinic");
  return html;
}

function python(st){
  const items = PYPATTERNS.map((p,i)=>({id:`ls:py:${i}`, item:mix(p.q)}));
  afterRender = () => {
    wireQs(main, items, "Python patterns");
    $$("[data-run]").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.run, out = $("#pyout-"+i);
      out.textContent = "Starting Python…";
      loadSkulpt().then(() => runPy($("#py-"+i).value)).then(({out:o, err}) => { out.textContent = (o || "(no output)") + (err ? "\n" + err : ""); })
        .catch(e => { out.textContent = e.message + ". Check the internet connection and try again."; });
    }));
    $$(".code-ed").forEach(ed => ed.addEventListener("keydown", e => { if (e.key === "Tab" && !e.shiftKey){ e.preventDefault(); ed.setRangeText("    ", ed.selectionStart, ed.selectionEnd, "end"); } }));
    loadSkulpt().catch(()=>{});
  };
  return `<p class="intro" style="margin-bottom:24px">The written tasks reuse a few code patterns. For each one, read the code and answer the question first. Then press Run to check, and try changing the code.</p>
  ${PYPATTERNS.map((p,i)=>`<section class="block"><h2>${p.h.replace(/^\d+ · /,"")}</h2><p class="soft">${p.why}</p>
    <textarea class="code-ed" id="py-${i}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code" rows="${p.code.split("\n").length+1}">${esc(p.code)}</textarea>
    ${qHTML(items[i].id, items[i].item, "Predict before you run")}
    <div class="row"><button class="btn small" data-run="${i}">Run the code</button></div><div class="out" id="pyout-${i}" aria-live="polite">The output will appear here.</div></section>`).join("")}`;
}

function secb(st){
  return `<p class="intro" style="margin-bottom:24px">Section B is worth ${S.track==="up"?"40":"60"} marks. Markers give marks for each step and each reason, not only the final answer. Here is how to shape each kind of answer, with model answers from the official marking guides.</p>
  ${SECB[S.track].map(f=>`<section class="block"><h2>${f.h}</h2><p><b>Use it for:</b> ${f.when}</p><p style="font-family:var(--f-read);font-size:19px;max-width:60ch">${f.how}</p>

}

function cheat(st){
  return `<section class="block"><h2>Facts to have in your head</h2><div class="cheat">${CHEAT[S.track].map(c=>`<div><b>${c[0]}</b><span>${c[1]}</span></div>`).join("")}</div></section>
  <section class="block"><h2>In the test room</h2><ul class="list">${GOLDEN[S.track].map(g=>`<li><b>${g[0]}</b><span class="soft">${g[1]}</span></li>`).join("")}</ul></section>`;
}

function fix(st){
  const m = mistakes(), ids = Object.keys(m);
  if (!ids.length) return `<div class="empty"><b>No saved mistakes</b><span class="soft">Every question you get wrong in the quick-fire rounds, the clinic and the papers is saved here. Answer it correctly and it leaves the list.</span></div>`;
  const items = ids.map(id => ({id, item:mix([m[id].q, m[id].o, m[id].a, m[id].e]), src:m[id].src}));
  afterRender = () => wireQs(main, items, "Fix", (ok, it, el) => {
    if (ok){ removeMistake(it.id); $("[data-qlabel]", el).textContent = "Fixed. Removed from your list."; }
  });
  return `<p class="intro" style="margin-bottom:20px">${plural(ids.length,"question")} to fix. Read each one slowly. Answer correctly and it leaves the list; answer wrongly and it stays for another try.</p>
  <div style="display:grid;gap:14px">${items.map((x,i)=>qHTML(x.id, x.item, `${i+1} of ${items.length}, from ${esc(x.src)}`)).join("")}</div>`;
}
