<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IJAIO Sprint Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centred study column with a sticky track + tab bar; each concept is a card that reads top to bottom: big idea, analogy, explanation, picture, worked example, try it, quick check. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E8ECF3; --ink:#131A2B; --muted:#586379; --line:#D5DBE6;
  --accent:#0B6E69; --accent-ink:#FFFFFF; --accent-soft:#D7EEEC; --hi:#F2B33D; --hi-soft:#FCEFD2;
  --good:#1E7A44; --good-soft:#DDF1E4; --bad:#B4323C; --bad-soft:#F8DEE0;
  --p-rep:#2E66D0; --p-lrn:#0C8566; --p-gen:#7B49CC; --p-int:#C8661E; --p-res:#BE3456;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1420; --surface:#171E2D; --sunk:#202839; --ink:#E7ECF5; --muted:#9AA6BC; --line:#2C3649;
  --accent:#3FC2B9; --accent-ink:#06201E; --accent-soft:#163A39; --hi:#F2B94F; --hi-soft:#3A2F17;
  --good:#5DD08C; --good-soft:#16352A; --bad:#F07A83; --bad-soft:#3D1E24;
  --p-rep:#6E9BF0; --p-lrn:#3FC79E; --p-gen:#AE8BEF; --p-int:#F09A55; --p-res:#F07595;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#171E2D; --sunk:#202839; --ink:#E7ECF5; --muted:#9AA6BC; --line:#2C3649;
  --accent:#3FC2B9; --accent-ink:#06201E; --accent-soft:#163A39; --hi:#F2B94F; --hi-soft:#3A2F17;
  --good:#5DD08C; --good-soft:#16352A; --bad:#F07A83; --bad-soft:#3D1E24;
  --p-rep:#6E9BF0; --p-lrn:#3FC79E; --p-gen:#AE8BEF; --p-int:#F09A55; --p-res:#F07595;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
h3{font-size:20px;font-weight:700}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.eyebrow,.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

header.top{padding-block:28px 18px;display:grid;gap:14px}
.spec{display:flex;flex-wrap:wrap;gap:8px}
.spec span{font-family:var(--f-mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.spec b{color:var(--ink);font-weight:600}
.lede{color:var(--muted);max-width:62ch}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:700;color:var(--muted);font-size:15px}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -3px 0 var(--accent)}

main{padding-top:22px}
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--pc)}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--pc)}
[data-p="rep"]{--pc:var(--p-rep)} [data-p="lrn"]{--pc:var(--p-lrn)} [data-p="gen"]{--pc:var(--p-gen)} [data-p="int"]{--pc:var(--p-int)} [data-p="res"]{--pc:var(--p-res)}

.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:14.5px}
.howto b{display:block;font-family:var(--f-display);font-size:15.5px}
@media (max-width:760px){.howto{grid-template-columns:repeat(2,minmax(0,1fr))}}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.plan div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.plan h4{font-size:15.5px;margin-bottom:4px}
.plan p{font-size:14.5px;color:var(--muted)}
@media (max-width:700px){.plan{grid-template-columns:1fr}}

.pnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pnav a{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 10px;display:inline-flex;gap:8px;align-items:center}
.pnav small{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}

.pillar{margin-bottom:34px;scroll-margin-top:120px}
.pillar > .ph{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--pc)}
.pillar > .ph .n{font-family:var(--f-mono);font-size:13px;color:var(--pc);font-weight:600;flex:none}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px;margin-bottom:16px;scroll-margin-top:120px}
.note.done{border-color:var(--good)}
.nhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.nhead h3{flex:1 1 260px}
.got{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;background:var(--surface)}
.got[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.bigidea{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.35;max-width:60ch;padding-left:14px;border-left:4px solid var(--pc)}
.like{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:8px;padding:10px 12px;max-width:72ch}
.like .lbl{color:var(--accent);flex:none;padding-top:3px}
@media (max-width:520px){.like{flex-direction:column;gap:2px}}
.body{display:grid;gap:10px;max-width:70ch;min-width:0}
.body ul,.body ol{margin:0;padding-left:22px;display:grid;gap:4px}
.terms{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;margin:0;font-size:15px}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--muted)}
@media (max-width:520px){.terms{grid-template-columns:1fr}.terms dd{margin-bottom:6px}}
.trap{background:var(--hi-soft);border-radius:8px;padding:10px 12px;font-size:15px}
.trap .lbl{color:var(--ink);margin-right:6px}
.formula{font-family:var(--f-mono);background:var(--sunk);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:14px}
.tablewrap{overflow-x:auto}
table.mini{border-collapse:collapse;font-size:14.5px}
table.mini th,table.mini td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
table.mini th{background:var(--sunk);font-weight:700}
table.mini td.num{font-family:var(--f-mono);text-align:center}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio > div{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;align-content:start;background:var(--bg)}
.trio b{font-family:var(--f-display);font-size:16.5px}
@media (max-width:700px){.trio{grid-template-columns:1fr}}

.figure{display:grid;gap:6px}
.flow{display:flex;align-items:stretch;gap:6px}
.fbox{flex:1 1 0;min-width:0;border:1.5px solid var(--pc);border-radius:8px;padding:9px 10px;background:var(--surface);display:grid;gap:2px;align-content:start}
.fbox b{font-family:var(--f-display);font-size:15px;color:var(--pc)}
.fbox span{font-size:13.5px}
.farrow{align-self:center;color:var(--muted);font-size:20px;flex:none;line-height:1}
.floop{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:680px){.flow{flex-direction:column}.flow .farrow{transform:rotate(90deg)}}
.cmgrid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:4px;max-width:520px;font-size:14px}
.cmgrid .h{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.cmgrid .c{border-radius:8px;padding:10px;display:grid;gap:2px}
.cmgrid .c b{font-family:var(--f-display);font-size:17px}
.cmgrid .ok{background:var(--good-soft)} .cmgrid .no{background:var(--bad-soft)}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;max-width:100%;height:auto}
.diff{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.diff figure{margin:0;display:grid;gap:3px;justify-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.diff canvas{width:72px;height:72px;border-radius:6px;image-rendering:pixelated;border:1px solid var(--line)}

.worked{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.worked .lbl{color:var(--pc)}
.worked .wq{font-weight:700}
.worked ol{margin:0;padding-left:22px;display:grid;gap:4px}
.worked ol:empty{display:none}
.worked li{font-family:var(--f-mono);font-size:14px}
.worked li.final{font-weight:600;color:var(--good)}

.widget{border:1px dashed var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;background:var(--bg);min-width:0}
.widget .wt{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{width:84px}
textarea{width:100%;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13.5px}
.tok{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--surface);font-family:var(--f-mono);font-size:13px}
.tok small{color:var(--muted);font-size:11px}
.toks{display:flex;flex-wrap:wrap;gap:6px}
.out{font-family:var(--f-mono);font-size:14px;background:var(--sunk);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.pgrid{display:grid;grid-template-columns:repeat(6,30px);gap:2px}
.pgrid button{width:30px;height:30px;border:1px solid var(--line);border-radius:3px;padding:0}
.ngrid{display:grid;grid-template-columns:repeat(6,auto);gap:2px 8px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;justify-content:start}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:14px}
.barrow .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;display:block}
.barrow .fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s;display:block}
.barrow > span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.cm{display:grid;grid-template-columns:auto auto auto;gap:4px;align-items:center;justify-content:start;font-size:14px}
.cm .h{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;padding:2px 6px}
.cm input{width:70px}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;margin-bottom:12px}
.check{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qtext{font-size:17px;font-weight:700;max-width:70ch}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);min-width:18px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15.5px}
.why b{margin-right:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.filters button[aria-pressed="true"] .chip{color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;margin-bottom:16px}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.score{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}

.card{min-height:220px;border:1.5px solid var(--pc);border-radius:14px;background:var(--surface);display:grid;place-items:center;align-content:center;text-align:center;padding:28px 20px;gap:12px;width:100%}
.card .term{font-family:var(--f-display);font-size:clamp(26px,5vw,36px);font-weight:800}
.card .def{font-size:19px;max-width:44ch}
.card .tap{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:15;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.timer .clock{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.timer .clock.low{color:var(--hi)}
.timer .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;margin-bottom:14px}
.scenario{background:var(--sunk);border-radius:8px;padding:12px;font-size:15px;display:grid;gap:8px;overflow-x:auto}
.scenario table{border-collapse:collapse;font-size:14px}
.scenario th,.scenario td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.part{display:grid;gap:8px}
.part .pl{font-weight:700}
.mp{display:grid;gap:6px;background:var(--good-soft);border-radius:8px;padding:10px 12px}
.mp label{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.mp input{margin-top:4px;accent-color:var(--good)}
.mp pre{font-family:var(--f-mono);font-size:13px;background:var(--surface);border-radius:6px;padding:8px;overflow-x:auto;margin:4px 0}
.sec{font-family:var(--f-display);font-size:20px;font-weight:700;margin:22px 0 10px}

.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;margin-bottom:18px}
.editor{font-family:var(--f-mono);font-size:13.5px;line-height:1.5;min-height:260px;tab-size:4;white-space:pre;overflow-x:auto;background:var(--sunk);border:1px solid var(--line)}
.result{display:grid;gap:4px}
.pass{color:var(--good);font-weight:700}
.fail{color:var(--bad);font-weight:700}
.loading{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">International Junior AI Olympiad 2026 · GIS training squad</span>
    <h1>IJAIO Sprint Reviewer</h1>
    <p class="lede" id="lede"></p>
    <div class="spec" id="spec"></div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Choose your level">
      <button data-track="up">Year 6 · Upper Primary</button>
      <button data-track="ls">Years 7–8 · Lower Secondary</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="learn">Learn</button>
      <button role="tab" data-tab="cards">Flashcards</button>
      <button role="tab" data-tab="drill">Drill</button>
      <button role="tab" data-tab="mock">Mock exam</button>
      <button role="tab" data-tab="lab" id="tab-lab">Python lab</button>
    </div>
  </div>

  <main id="main"></main>
</div>

<script>
/* ================= content ================= */
const PILLARS = {
  rep:{name:"Representation", q:"How does AI turn the world into numbers?"},
  lrn:{name:"Learning", q:"How does AI learn from examples?"},
  gen:{name:"Generation", q:"How does AI make new text and images?"},
  int:{name:"Interaction & Agency", q:"How do we talk to AI, and how does it act?"},
  res:{name:"Responsibility", q:"How do we use AI safely and fairly?"}
};
const PORDER = ["rep","lrn","gen","int","res"];

const TRACKS = {
  up:{
    label:"Upper Primary", grades:"Year 6 (Grades 4–6 division)",
    lede:"Every idea is explained in simple steps with a picture, an example and a quick check. Learn the five pillars, practise, then sit the mock.",
    spec:[["60","minutes"],["30","MCQ · 60 marks"],["2","structured · 40 marks"],["0","marks lost for wrong answers"]],
    minutes:60, mcqCount:30, mcqMarks:2,
    plan:[
      ["Day 1 · Understand","Learn: Representation and Learning. Do every worked example and quick check. Flashcards for 10 minutes."],
      ["Day 2 · Practise","Learn: Generation, Interaction and Responsibility. Drill your weakest pillar until you score 8/10."],
      ["Day 3 · Exam run","Sit the full mock in 60 minutes. Read every explanation you got wrong, then flashcards once more."]
    ]
  },
  ls:{
    label:"Lower Secondary", grades:"Years 7–8 (Grades 7–8 division)",
    lede:"Every idea is broken into a big idea, a picture, a worked example and a quick check. Learn the mechanics, practise in Python, then sit the 90-minute mock.",
    spec:[["90","minutes"],["20","MCQ · 40 marks"],["3","structured / Python · 60 marks"],["0","marks lost for wrong answers"]],
    minutes:90, mcqCount:20, mcqMarks:2,
    plan:[
      ["Day 1 · Mechanics","Learn: Representation and Learning. Python labs 1, 3 and 5. Flashcards for 10 minutes."],
      ["Day 2 · Models and agents","Learn: Generation, Interaction and Responsibility. Labs 2 and 4. Drill your weakest pillar."],
      ["Day 3 · Exam run","Full 90-minute mock with Python ready. Mark Section B honestly, then re-read the notes you missed."]
    ]
  }
};

function flow(items, opts={}){

}

words = text.split()

def bigram_counts(words):
    counts = {}
    for i in range(len(words) - 1):
        w1 = words[i]
        w2 = words[i + 1]
        if w1 not in counts:
            counts[w1] = {}
        counts[w1][w2] = counts[w1].get(w2, 0) + 1

    followers = counts[word]
    best = None
    for w in followers:

        elif a == 0 and p == 1:

};

if (validTabs.includes(hsh)) state.tab = hsh;

function setTrack(t){

function mountQuestion(el, q, onAnswer){
  let picked = null;
  const draw = () => {
    const done = picked !== null;
    el.querySelector(".opts").innerHTML = q.opts.map((o,k)=>{
      let cls=""; if(done){ if(k===q.ans) cls="right"; else if(k===picked) cls="wrong"; }
      return `<button class="opt ${cls}" data-k="${k}" ${done?"disabled":""}><span class="k">${LETTERS[k]}</span><span>${o}</span></button>`;
    }).join("");
    el.querySelector(".whybox").innerHTML = done ? `<div class="why"><b>${picked===q.ans?"Correct!":"Not quite."}</b>${q.why}</div>` : "";
    el.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.addEventListener("click",()=>{ picked=+b.dataset.k; draw(); if (onAnswer) onAnswer(picked===q.ans); }));
  };
  draw();
}

  main.querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById("p-"+a.dataset.jump).scrollIntoView({behavior:"smooth"}); }));
  main.querySelectorAll("[data-drillp]").forEach(b => b.addEventListener("click", () => { drill.filter = b.dataset.drillp; drill.run = null; setTab("drill"); }));
  main.querySelectorAll("[data-got]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.got, d = doneSet(); d.has(i) ? d.delete(i) : d.add(i); store.set("done:"+state.track, [...d]);
    const on = d.has(i); b.setAttribute("aria-pressed", on); b.textContent = on ? "✓ I understand this" : "I understand this";
    b.closest(".note").classList.toggle("done", on);
    const p = notes[i].p, idx = notes.map((n,k)=>[n,k]).filter(x=>x[0].p===p);
    main.querySelector(`[data-jump="${p}"] small`).textContent = `${idx.filter(x=>d.has(x[1])).length}/${idx.length}`;
    $("#donecount").textContent = countLine(d);
  }));
  main.querySelectorAll("[data-worked]").forEach(w => {
    const steps = notes[+w.dataset.worked].worked.s; let shown = 0;
    const ol = $("ol", w), bStep = $("[data-step]", w), bAll = $("[data-all]", w);
    const draw = () => {
      ol.innerHTML = steps.slice(0, shown).map((s,k)=>`<li class="${k===steps.length-1?"final":""}">${s}</li>`).join("");
      bStep.hidden = bAll.hidden = shown >= steps.length;
      bStep.textContent = shown ? `Next step (${shown+1} of ${steps.length})` : "Show first step";
    };
    bStep.addEventListener("click", () => { shown++; draw(); if (shown < steps.length) bStep.focus(); });
    bAll.addEventListener("click", () => { shown = steps.length; draw(); });

  if (state.jump){ const el = document.getElementById(state.jump); state.jump = null; if (el) setTimeout(()=>el.scrollIntoView({behavior:"smooth"}), 30); }
}

function drawDiffusion(el){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const N = 48, base = [];
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    let c;
    const hill = y > 31 + 5*Math.sin(x/7);
    const sun = (x-33)**2 + (y-14)**2 < 64;
    if (sun) c=[250,196,60]; else if (hill) c=[70,150,80]; else { const t=y/N; c=[110+60*t,170+40*t,235]; }
    base.push(c);
  }
  const noise = base.map(()=>[rnd()*255,rnd()*255,rnd()*255]);
  el.querySelectorAll("canvas").forEach(cv => {
    const n = 1 - (+cv.dataset.n)/4, ctx = cv.getContext("2d");
    if (!ctx) return;
    const img = ctx.createImageData(N,N);
    base.forEach((c,i)=>{ for(let k=0;k<3;k++) img.data[i*4+k] = c[k]*(1-n) + noise[i][k]*n; img.data[i*4+3]=255; });
    ctx.putImageData(img,0,0);
  });
}

const cards = { deck:null, i:0, flipped:false, known:0, p:"all" };
function buildDeck(){
  const all = [];
  NOTES[state.track].forEach(n => (n.terms||[]).forEach(t => { if(!all.some(x=>x.t===t[0])) all.push({t:t[0], d:t[1], p:n.p}); }));
  return shuffle(all.filter(c=>cards.p==="all"||c.p===cards.p));
}
function renderCards(){
  if (!cards.deck){ cards.deck = buildDeck(); cards.i = 0; cards.flipped = false; cards.known = 0; }
  const deck = cards.deck;
  let html = `<div class="section-head"><h2>Flashcards</h2><span class="muted">Say the meaning out loud, then flip to check.</span></div>
  <div class="filters" role="group" aria-label="Pillar filter"><button data-cp="all" aria-pressed="${cards.p==="all"}">All terms</button>${PORDER.map(p=>`<button data-cp="${p}" aria-pressed="${cards.p===p}">${chip(p)}</button>`).join("")}</div>`;
  if (!deck.length || cards.i >= deck.length){
    html += `<div class="panel"><span class="lbl">Deck finished</span><div class="score">${cards.known}</div><p>terms you knew the first time. Cards you marked "Again later" came back until you knew them.</p><div class="row"><button class="btn primary" id="cd-new">Shuffle and start again</button></div></div>`;
    main.innerHTML = html;
  } else {
    const c = deck[cards.i];
    html += `<div class="progress" style="margin-bottom:12px"><div style="width:${cards.i/deck.length*100}%"></div></div>
    <p class="qnum" style="margin-bottom:8px">Card ${cards.i+1} of ${deck.length}</p>
    <button class="card" data-p="${c.p}" id="cd-card" aria-live="polite">${chip(c.p)}<span class="term">${c.t}</span>${cards.flipped?`<span class="def">${c.d}</span>`:`<span class="tap">tap to flip</span>`}</button>
    <div class="row" style="margin-top:14px;justify-content:center">${cards.flipped?`<button class="btn" id="cd-again">Again later</button><button class="btn primary" id="cd-got">I knew it</button>`:`<button class="btn primary" id="cd-flip">Flip card</button>`}</div>`;
    main.innerHTML = html;
    const flip = () => { cards.flipped = true; renderCards(); $("#cd-got")?.focus(); };
    $("#cd-card").addEventListener("click", () => { if(!cards.flipped) flip(); });
    $("#cd-flip")?.addEventListener("click", flip);
    $("#cd-got")?.addEventListener("click", () => { if(!c.again) cards.known++; cards.i++; cards.flipped=false; renderCards(); });
    $("#cd-again")?.addEventListener("click", () => { c.again = true; deck.push(c); cards.i++; cards.flipped=false; renderCards(); });
  }
  main.querySelectorAll("[data-cp]").forEach(b=>b.addEventListener("click",()=>{ cards.p=b.dataset.cp; cards.deck=null; renderCards(); }));
  $("#cd-new")?.addEventListener("click",()=>{ cards.deck=null; renderCards(); });
}

const drill = { filter:"all", run:null };
function statsKey(){ return "stats:"+state.track; }
function revise(p){ state.jump = "p-"+p; state.tab = "learn"; render(); }
function renderDrill(){
  const bank = MCQ[state.track];
  const stats = store.get(statsKey(), {});
  const newRun = () => { const pool = bank.filter(q=>drill.filter==="all"||q[0]===drill.filter); drill.run = {qs: shuffle(pool).slice(0,10).map(prepQ), i:0, right:0, missed:{}}; renderDrill(); };
  if (!drill.run){
    const counts = p => bank.filter(q=>p==="all"||q[0]===p).length;
    main.innerHTML = `<div class="section-head"><h2>Quick drill</h2><span class="muted">Instant marking and a reason for every answer.</span></div>
    <div class="filters" role="group" aria-label="Pillar filter">
      <button data-f="all" aria-pressed="${drill.filter==="all"}">All pillars (${bank.length})</button>
      ${PORDER.map(p=>`<button data-f="${p}" aria-pressed="${drill.filter===p}">${chip(p)} <span class="muted">${counts(p)}</span></button>`).join("")}
    </div>

    <div class="panel"><h3>Your weak spots</h3>
    <div class="bars">${PORDER.map(p=>{ const s=stats[p]||{r:0,t:0}; const pct=s.t?Math.round(s.r/s.t*100):0;
      return `<div class="barrow" style="grid-template-columns:150px minmax(0,1fr) 96px"><span>${chip(p)}</span><span class="track"><span class="fill" style="width:${pct}%;background:var(--p-${p})"></span></span><span>${s.t?pct+"% of "+s.t:"not tried"}</span></div>`; }).join("")}</div>
    <p class="muted">Saved on this device. Revise and drill anything below 80% again.</p>
    <div class="row"><button class="btn" id="reset">Clear my scores</button></div></div>`;
    main.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{drill.filter=b.dataset.f; renderDrill();}));
    $("#go").addEventListener("click",newRun);
    $("#reset").addEventListener("click",()=>{ store.set(statsKey(),{}); renderDrill(); });
    return;
  }
  const r = drill.run;
  if (r.i >= r.qs.length){
    const weak = Object.keys(r.missed);
    main.innerHTML = `<div class="panel"><span class="lbl">Drill complete</span><div class="score">${r.right}/${r.qs.length}</div>
    <p>${r.right===r.qs.length?"Perfect! Move on to another pillar or try the mock.":r.right>=8?"Strong. Read the explanations you missed, then try another set.":"Revise the notes below, then drill again."}</p>
    ${weak.length?`<p class="lbl">Revise these</p><div class="row">${weak.map(p=>`<button class="btn" data-rev="${p}">${chip(p)} <span class="muted">${r.missed[p]} missed</span></button>`).join("")}</div>`:""}
    <div class="row"><button class="btn primary" id="again">New drill</button><button class="btn" id="back">Change pillar</button></div></div>`;
    $("#again").addEventListener("click",newRun);
    $("#back").addEventListener("click",()=>{ drill.run=null; renderDrill(); });
    main.querySelectorAll("[data-rev]").forEach(b=>b.addEventListener("click",()=>revise(b.dataset.rev)));
    return;
  }
  const q = r.qs[r.i];
  main.innerHTML = `<div class="progress" style="margin-bottom:14px"><div style="width:${r.i/r.qs.length*100}%"></div></div>
  <div class="qcard" id="dq"><div class="qtop"><span class="qnum" id="dqn">Question ${r.i+1} of ${r.qs.length} · score ${r.right}</span>${chip(q.p)}</div>
  <div class="qtext">${q.q}</div><div class="opts"></div><div class="whybox"></div><div class="row" id="after" hidden></div></div>
  <div class="row"><button class="btn" id="quit">End drill</button></div>`;
  mountQuestion($("#dq"), q, ok => {
    if (ok) r.right++; else r.missed[q.p] = (r.missed[q.p]||0)+1;
    const st = store.get(statsKey(),{}); st[q.p] = st[q.p]||{r:0,t:0}; st[q.p].t++; if(ok) st[q.p].r++; store.set(statsKey(),st);
    const a = $("#after"); a.hidden = false;
    a.innerHTML = `<button class="btn primary" id="next">${r.i+1<r.qs.length?"Next question":"See score"}</button>${ok?"":`<button class="btn" id="rev">Revise ${PILLARS[q.p].name} notes</button>`}`;
    $("#dqn").textContent = `Question ${r.i+1} of ${r.qs.length} · score ${r.right}`;
    $("#next").addEventListener("click",()=>{ r.i++; renderDrill(); window.scrollTo({top:0}); });
    $("#rev")?.addEventListener("click",()=>revise(q.p));
    $("#next").focus();
  });
  $("#quit").addEventListener("click",()=>{ drill.run=null; renderDrill(); });
}

    <p class="muted">Section A is marked automatically. For Section B, write your answers, then tick the marking points you earned. ${state.track==="ls"?"Keep Python open for Task 1(c).":""}</p>
    <div class="trap"><span class="lbl">Exam tips</span>Do Section A first, in about ${Math.round(T.minutes*0.4)} minutes. In Section B show your working: marks are given for each step, not just the final answer.</div>

      renderMock(); window.scrollTo({top:0});
    });
    return;
  }
  const m = mock.run, tasks = TASKS[state.track];

  const bScore = () => Object.values(m.ticks).reduce((s,v)=>s+v,0);

  if (m.submitted){
    html += `<div class="panel"><span class="eyebrow">Your result</span><div class="score"><span id="tot">${mcqScore()+bScore()}</span>/100</div>
    <p>Section A: <b>${mcqScore()}</b>/${m.qs.length*T.mcqMarks} · Section B: <b id="bsc">${bScore()}</b>/${tasks.reduce((s,t)=>s+t.marks,0)} (tick the marking points below)</p>
    <div class="bars">${PORDER.map(p=>{ const qs=m.qs.map((q,i)=>[q,i]).filter(x=>x[0].p===p); if(!qs.length) return ""; const r=qs.filter(x=>m.picks[x[1]]===x[0].ans).length;
      return `<div class="barrow" style="grid-template-columns:150px 1fr 60px"><span>${chip(p)}</span><span class="track"><span class="fill" style="display:block;width:${r/qs.length*100}%;background:var(--p-${p})"></span></span><span>${r}/${qs.length}</span></div>`; }).join("")}</div></div>`;
  }
  html += `<div class="sec">Section A · Multiple choice</div>`;
  m.qs.forEach((q,i)=>{
    const pk = m.picks[i];
    html += `<div class="qcard"><div class="qtop"><span class="qnum">Q${i+1} · ${T.mcqMarks} marks</span>${m.submitted?chip(q.p):""}</div><div class="qtext">${q.q}</div>
    <div class="opts">${q.opts.map((o,k)=>{ let cls=""; if(m.submitted){ if(k===q.ans) cls="right"; else if(k===pk) cls="wrong"; } else if(k===pk) cls="sel";
      return `<button class="opt ${cls}" data-q="${i}" data-k="${k}" ${m.submitted?"disabled":""} aria-pressed="${k===pk}"><span class="k">${LETTERS[k]}</span><span>${o}</span></button>`; }).join("")}</div>
    ${m.submitted?`<div class="why"><b>${pk===q.ans?"Correct.":pk===undefined?"Not answered.":"Not quite."}</b>${q.why}</div>`:""}</div>`;
  });
  html += `<div class="sec">Section B · Structured tasks</div>`;
  tasks.forEach((t,ti)=>{
    html += `<div class="task"><div class="qtop"><h3>${t.title}</h3><span class="qnum">${t.marks} marks</span></div><div class="scenario">${t.scenario}</div>`;
    t.parts.forEach((p,pi)=>{
      const key = ti+"-"+pi;
      html += `<div class="part"><span class="pl">${p.label} ${p.q} <span class="muted">[${p.marks}]</span></span>
      <textarea rows="${p.label==="(c)"&&ti===0&&state.track==="ls"?6:3}" id="ans-${key}" data-key="${key}" ${m.submitted?"readonly":""} aria-label="Answer ${p.label}">${esc(m.answers[key]||"")}</textarea>`;
      if (m.submitted){
        html += `<div class="mp"><span class="eyebrow">Marking points · tick what you earned</span>${p.mps.map((mp,mi)=>`<label><input type="checkbox" data-tick="${key}-${mi}" data-pts="${mp[0]}" ${m.ticks[key+"-"+mi]?"checked":""}><span><b>${mp[0]}</b> · ${mp[1]}</span></label>`).join("")}</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  });
  main.innerHTML = html;

  const ansCount = () => { const el=$("#ans"); if(el) el.textContent = Object.keys(m.picks).length; };
  ansCount();
  main.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.addEventListener("click",()=>{
    const qi=+b.dataset.q; m.picks[qi]=+b.dataset.k;
    main.querySelectorAll(`[data-q="${qi}"]`).forEach(o=>{ const s=+o.dataset.k===m.picks[qi]; o.classList.toggle("sel",s); o.setAttribute("aria-pressed",s); });
    ansCount();
  }));
  main.querySelectorAll("textarea[data-key]").forEach(t=>t.addEventListener("input",()=>{ m.answers[t.dataset.key]=t.value; }));
  main.querySelectorAll("[data-tick]").forEach(c=>c.addEventListener("change",()=>{
    m.ticks[c.dataset.tick] = c.checked ? +c.dataset.pts : 0;
    $("#bsc").textContent = bScore(); $("#tot").textContent = mcqScore()+bScore();
  }));
  const submit = () => { m.submitted = true; renderMock(); window.scrollTo({top:0}); };
  $("#submit")?.addEventListener("click",()=>{
    const left = m.qs.length - Object.keys(m.picks).length;
    const b = $("#submit");
    if (left>0 && b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=`${left} unanswered · submit anyway`; return; }
    submit();
  });
  $("#new")?.addEventListener("click",()=>{ mock.run=null; renderMock(); });

  const tick = () => {
    const c = $("#clock"); if (!c) return;
    if (m.submitted){ c.textContent = "Done"; return; }
    const s = Math.max(0, Math.round((m.end-Date.now())/1000));
    c.textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    c.classList.toggle("low", s<300);
    if (s<=0){ clearInterval(mockTimer); mockTimer=null; submit(); }
  };
  tick(); if (!m.submitted) mockTimer = setInterval(tick, 1000);
}

/* ---------- LAB ---------- */
let skulptReady = null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Could not load "+src)); document.head.appendChild(s); }); }
function loadSkulpt(){
  if (!skulptReady) skulptReady = loadScript("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js")
    .then(()=>loadScript("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"))
    .catch(e=>{ skulptReady=null; throw e; });
  return skulptReady;
}
function runPy(code){
  let out = "";
  Sk.configure({
    output: t => { out += t; },
    read: f => { if (Sk.builtinFiles===undefined || Sk.builtinFiles.files[f]===undefined) throw "File not found: '"+f+"'"; return Sk.builtinFiles.files[f]; },
    __future__: Sk.python3, execLimit: 5000, yieldLimit: 100
  });
  return Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>", false, code, true))
    .then(()=>({out, err:null}), e=>({out, err: (e && e.toString) ? e.toString().replace("TimeLimitError","Your code ran too long (infinite loop?). TimeLimitError") : String(e)}));
}
const labCode = store.get("labs", {});
function renderLab(){
  let html = `<div class="section-head"><h2>Python lab</h2><span class="muted">Python runs in your browser. Run to see output, Check to test your functions.</span></div>
  <div class="trap" style="margin-bottom:16px"><span class="lbl">On the day</span>The real paper uses Python 3 in Jupyter Notebook or Google Colab on a laptop. These labs use plain Python with no extra libraries, which works in both.</div>`;
  LABS.forEach((L,i)=>{
    html += `<section class="lab"><div class="qtop"><h3>${L.title}</h3><span class="eyebrow">${L.concept}</span></div><p>${L.brief}</p>
    <textarea class="editor" id="code-${i}" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code for ${esc(L.title)}">${esc(labCode[i] ?? L.starter)}</textarea>
    <div class="row"><button class="btn primary" data-run="${i}">Run</button><button class="btn" data-check="${i}">Check</button><button class="btn" data-sol="${i}">Show solution</button><button class="btn" data-reset="${i}">Reset</button></div>
    <div class="result" id="res-${i}"></div></section>`;
  });
  main.innerHTML = html;
  main.querySelectorAll(".editor").forEach(ed=>{
    ed.addEventListener("keydown",e=>{
      if (e.key==="Tab" && !e.shiftKey){ e.preventDefault(); const s=ed.selectionStart; ed.setRangeText("    ", s, ed.selectionEnd, "end"); ed.dispatchEvent(new Event("input")); }
    });
    ed.addEventListener("input",()=>{ labCode[ed.id.split("-")[1]] = ed.value; store.set("labs", labCode); });
  });
  const res = (i, html) => { $("#res-"+i).innerHTML = html; };
  const go = (i, withTests) => {
    res(i, `<span class="loading">Starting Python…</span>`);
    loadSkulpt().then(()=>{
      const code = $("#code-"+i).value;
      const full = withTests ? code + "\n" + TEST_HELPER + "\n" + LABS[i].tests : code;
      return runPy(full).then(({out, err})=>{
        if (withTests){
          const lines = out.split("\n");
          const tests = lines.filter(l=>/^(PASS|FAIL): /.test(l));
          const passed = tests.filter(l=>l.startsWith("PASS")).length;
          let r = tests.length ? `<div class="${passed===tests.length?"pass":"fail"}">${passed}/${tests.length} checks passed${passed===tests.length?". Well done!":""}</div>` + tests.map(l=>`<div class="${l.startsWith("PASS")?"pass":"fail"}">${l.startsWith("PASS")?"✓":"✗"} ${esc(l.slice(6))}</div>`).join("") : "";
          if (err) r += `<div class="out fail">${esc(err)}</div>`;
          res(i, r || `<div class="out">No output</div>`);
        } else {
          res(i, `<div class="out">${esc(out || "(no output)")}</div>${err?`<div class="out fail">${esc(err)}</div>`:""}`);
        }
      });
    }).catch(e=>res(i, `<div class="out fail">${esc(e.message)}. Check your internet connection and try again.</div>`));
  };
  main.querySelectorAll("[data-run]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.run,false)));
  main.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.check,true)));
  main.querySelectorAll("[data-sol]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.sol;
    if (b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="Replace my code with the solution?"; return; }
    const ed=$("#code-"+i); ed.value=LABS[i].solution; labCode[i]=ed.value; store.set("labs",labCode); b.dataset.sure=""; b.textContent="Show solution";
  }));
  main.querySelectorAll("[data-reset]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.reset;
    if (b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="Erase my code?"; return; }
    const ed=$("#code-"+i); ed.value=LABS[i].starter; delete labCode[i]; store.set("labs",labCode); b.dataset.sure=""; b.textContent="Reset"; res(i,"");
  }));
  loadSkulpt().catch(()=>{});
}



render();
