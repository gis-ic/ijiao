/* ---------- EXAM ---------- */
function startExam(paper, mode, stepId){
  const P = OFFICIAL[S.track][paper], t = T();
  const mins = mode === "full" ? t.minutes : t.sprintMin;
  exam = {paper, mode, stepId, name:P.name, qs:P.mcq, tasks: mode==="full" ? P.tasks : [], pick:{}, flag:{}, cur:0, sec:"A", tcur:0, text:{}, end:Date.now()+mins*60000, submitted:false, confirm:null, marks:{}, filter:"all"};
  S.view = "exam"; render(); window.scrollTo({top:0});
  startTimer();
}
function startTimer(){ stopTimer(); updateClock(); timer = setInterval(updateClock, 1000); }
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }
function updateClock(){
  const c = $("#clock"); if (!exam || !c) return;
  if (exam.submitted){ c.textContent = "Finished"; return; }
  const s = Math.max(0, Math.round((exam.end - Date.now())/1000));
  c.textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  c.classList.toggle("low", s < 300);
  if (s <= 0) submitExam();
}
function submitExam(){
  const e = exam; if (!e || e.submitted) return;
  e.submitted = true; e.confirm = null; stopTimer();
  e.qs.forEach((q,i) => { if (e.pick[i] !== q[3]) addMistake(`${S.track}:${e.paper}:${i}`, {q:q[1]+(q[5]?`<div class="byhand" style="margin-top:10px">${q[5]}</div>`:""), o:q[2], a:q[3], e:q[4], src:`Official Paper ${e.paper}`}); });
  const key = `best:${S.track}:${e.paper}:${e.mode}`, a = mcqScore(), prev = store.get(key, null);
  if (e.mode === "sprint" && (prev === null || a > prev)) store.set(key, a);
  if (e.stepId) markDone(e.stepId);
  render(); window.scrollTo({top:0});
}
const mcqScore = () => exam.qs.reduce((s,q,i) => s + (exam.pick[i] === q[3] ? T().mcqMarks : 0), 0);
const bScore = () => Object.values(exam.marks).reduce((s,v) => s + v, 0);
const isCodeTask = t => /Python|Program/.test(t.title);

function renderExam(){
  const e = exam; if (!e){ go("route"); return; }
  const t = T(), N = e.qs.length, answered = Object.keys(e.pick).length;
  $(".seg").hidden = !e.submitted;
  let html = `<div class="xbar"><div class="nm">${e.name}<span>${e.mode==="full"?"Full paper":"Section A only"}, ${t.label}</span></div>
    <span class="clock" id="clock">--:--</span>
    ${e.submitted ? `<button class="btn small" id="xback">All stops</button>` : `<button class="btn small" id="xsubmit">Submit</button>`}</div>`;
  if (!e.submitted && e.confirm){
    const left = N - answered, fl = Object.values(e.flag).filter(Boolean).length;
    html += e.confirm === "leave"
      ? `<div class="confirm"><b>Leave this paper?</b><span>Your answers will not be kept.</span><div class="row"><button class="btn" id="cno">Keep working</button><button class="btn" id="cleave">Leave without submitting</button></div></div>`
      : `<div class="confirm"><b>Submit your paper?</b><span>${left ? `${plural(left,"question")} still empty. Guess them: wrong answers lose no marks.` : "Every question is answered."}${fl ? ` ${fl} still flagged.` : ""}</span><div class="row"><button class="btn" id="cno">Keep working</button><button class="btn primary" id="cyes">Submit now</button></div></div>`;
  }
  if (e.submitted) html += resultsHTML();
  html += `<div class="xsub">${e.tasks.length ? `<div class="tabs" role="tablist"><button role="tab" data-sec="A" aria-selected="${e.sec==="A"}">Section A</button><button role="tab" data-sec="B" aria-selected="${e.sec==="B"}">Section B</button></div>` : `<span></span>`}
    ${e.submitted ? "" : `<span class="score-line">${answered} of ${N} answered</span>`}</div>`;
  html += e.sec === "A" ? (e.submitted ? reviewA() : questionA()) : sectionB();
  main.innerHTML = html;
  wireExam();
  updateClock();
}
function questionA(){
  const e = exam, q = e.qs[e.cur], N = e.qs.length, pk = e.pick[e.cur];
  return `<div class="xgrid"><div class="q">
    <div class="qhead"><span class="label">Question ${e.cur+1} of ${N}</span><span class="marks">[${T().mcqMarks}]</span></div>
    ${q[5] ? `<div class="byhand">${q[5]}</div>` : ""}
    <div class="qtext">${q[1]}</div>
    <div class="opts" role="radiogroup">${q[2].map((o,k)=>`<button class="opt${pk===k?" sel":""}" data-pick="${k}" role="radio" aria-checked="${pk===k}"><span class="bub">${LET[k]}</span><span>${o}</span></button>`).join("")}</div>
    <div class="xnav"><button class="btn small" id="xprev" ${e.cur===0?"disabled":""}>Back</button>
      <button class="btn small${e.flag[e.cur]?" flagon":""}" id="xflag" aria-pressed="${!!e.flag[e.cur]}">${e.flag[e.cur]?"Flagged":"Flag to review"}</button>
      ${e.cur < N-1 ? `<button class="btn small primary" id="xnext">Next</button>` : (e.tasks.length ? `<button class="btn small primary" id="xtoB">Go to Section B</button>` : `<button class="btn small primary" id="xend">Finish</button>`)}</div>
  </div>
  <aside class="map" aria-label="Question map"><span class="label">Question map</span>
    <div class="mapg">${e.qs.map((x,i)=>`<button data-go="${i}" class="${e.pick[i]!==undefined?"ans":""}${i===e.cur?" cur":""}${e.flag[i]?" fl":""}" aria-label="Question ${i+1}${e.pick[i]!==undefined?", answered":""}${e.flag[i]?", flagged":""}">${i+1}</button>`).join("")}</div>
    <div class="key"><span>Blue: answered</span><span>Yellow ring: flagged</span></div></aside></div>`;
}
function reviewA(){
  const e = exam;
  const list = e.qs.map((q,i)=>[q,i]).filter(([q,i]) => e.filter === "all" || (e.filter === "wrong" ? e.pick[i] !== q[3] : !!e.flag[i]));
  return `<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="font-size:21px">Check your answers</h2>
    <div class="tabs">${[["all","All"],["wrong","Wrong or empty"],["flag","Flagged"]].map(f=>`<button data-filter="${f[0]}" aria-pressed="${e.filter===f[0]}">${f[1]}</button>`).join("")}</div></div>
    <div style="display:grid;gap:14px">${list.length ? list.map(([q,i])=>{ const pk = e.pick[i], ok = pk === q[3];
      return `<div class="q"><div class="qhead"><span class="label">Question ${i+1}: ${ok?"correct":pk===undefined?"not answered":"wrong"}</span><span class="marks">[${ok?T().mcqMarks:0}/${T().mcqMarks}]</span></div>
      ${q[5]?`<div class="byhand">${q[5]}</div>`:""}<div class="qtext">${q[1]}</div>
      <div class="opts">${q[2].map((o,k)=>`<button class="opt${k===q[3]?" right":k===pk?" wrong":""}" disabled><span class="bub">${LET[k]}</span><span>${o}</span></button>`).join("")}</div>
      <p class="why ${ok?"ok":"no"}"><b>${ok?"Correct.":"The answer is "+LET[q[3]]+"."}</b>${q[4]}</p></div>`; }).join("")
      : `<div class="empty"><span class="soft">No questions in this list.</span></div>`}</div>`;
}
function sectionB(){
  const e = exam, ti = e.tcur, tk = e.tasks[ti];
  let html = `<div class="tabs" style="margin-bottom:16px">${e.tasks.map((x,i)=>`<button data-task="${i}" aria-pressed="${i===ti}">Task ${i+1}</button>`).join("")}</div>
  <div class="task"><div class="qhead"><h2 style="font-size:21px">${tk.title}</h2><span class="marks">[${tk.marks}]</span></div><div class="scen"><div>${tk.scenario}</div>${tk.code?`<pre>${esc(tk.code)}</pre>`:""}</div>`;
  tk.parts.forEach((p,pi) => {
    const key = ti+"-"+pi, m = e.marks[key];
    html += `<div class="part"><div class="qhead"><span style="font-weight:700">${p.q}</span><span class="marks">[${p.marks}]</span></div>
      <textarea id="b-${key}" data-key="${key}" class="${isCodeTask(tk)?"code":""}" spellcheck="${isCodeTask(tk)?"false":"true"}" ${e.submitted?"readonly":""} aria-label="Your answer" placeholder="${e.submitted?"No answer written.":"Type your answer. Put each step on its own line."}">${esc(e.text[key]||"")}</textarea>`;
    if (e.submitted){
      const half = Math.round(p.marks/2);
      html += `<div class="model"><b style="color:var(--good)">Official marking guide</b><div style="margin-top:6px">${p.model}</div></div>
      <div class="selfmark"><span class="label">Your mark:</span>${[[0,"0"],[half,`${half}, part right`],[p.marks,`${p.marks}, all right`]].map(([v,l])=>`<button data-mark="${key}" data-v="${v}" aria-pressed="${m===v}">${l}</button>`).join("")}</div>`;
    }
    html += `</div>`;
  });
  html += `<div class="xnav"><button class="btn small" data-task="${Math.max(0,ti-1)}" ${ti===0?"disabled":""}>Previous task</button>
    ${ti < e.tasks.length-1 ? `<button class="btn small primary" data-task="${ti+1}">Next task</button>` : (e.submitted ? "" : `<button class="btn small primary" id="xend">Finish</button>`)}</div></div>`;
  return html;
}
function resultsHTML(){
  const e = exam, t = T(), a = mcqScore(), aMax = e.qs.length * t.mcqMarks;
  const right = e.qs.filter((q,i)=>e.pick[i]===q[3]).length, pct = right / e.qs.length;
  const bMax = e.tasks.reduce((s,x)=>s+x.marks,0), b = bScore();
  const msg = pct >= .8 ? "Strong result. Read the explanations for the ones you missed, then move to the next stop." : pct >= .6 ? "A good base. Every wrong answer is saved in Fix my mistakes, so clear that list tomorrow morning." : "Go back over the must-know facts for the topics below, then work through Fix my mistakes.";
  const byTag = {}; e.qs.forEach((q,i)=>{ const k = TAGS[q[0]]; byTag[k] = byTag[k] || [0,0]; byTag[k][1]++; if (e.pick[i]===q[3]) byTag[k][0]++; });
  return `<div class="result"><span class="label">Your result</span>
    ${e.tasks.length ? `<div class="score">${a + b} <small>out of 100</small></div><p>Section A: ${a} of ${aMax}. Section B: ${b} of ${bMax}. <span class="soft">Open Section B and mark each answer against the official guide.</span></p>`
      : `<div class="score">${right} <small>out of ${e.qs.length} correct</small></div><p>That is ${a} of ${aMax} marks for Section A.</p>`}
    <p>${msg}</p>
    <p class="soft">${Object.entries(byTag).map(([k,v])=>`${k}: ${v[0]} of ${v[1]}`).join(". ")}.</p>
    <div class="row"><button class="btn primary" id="xagain">Sit it again</button><button class="btn" id="xfix">Fix my mistakes</button></div></div>`;
}
function wireExam(){
  const e = exam;
  const ask = () => { e.confirm = "submit"; renderExam(); window.scrollTo({top:0}); };
  $("#xsubmit")?.addEventListener("click", ask);
  $("#xend")?.addEventListener("click", ask);
  $("#cno")?.addEventListener("click", () => { e.confirm = null; renderExam(); });
  $("#cyes")?.addEventListener("click", submitExam);
  $("#cleave")?.addEventListener("click", () => { exam = null; go("route"); });
  $("#xback")?.addEventListener("click", () => go("route"));
  $("#xagain")?.addEventListener("click", () => startExam(e.paper, e.mode, e.stepId));
  $("#xfix")?.addEventListener("click", () => go("step", "fix"));
  $$("[data-sec]").forEach(b => b.addEventListener("click", () => { e.sec = b.dataset.sec; renderExam(); }));
  $$("[data-pick]").forEach(b => b.addEventListener("click", () => { e.pick[e.cur] = +b.dataset.pick; renderExam(); }));
  $$("[data-go]").forEach(b => b.addEventListener("click", () => { e.cur = +b.dataset.go; renderExam(); }));
  $("#xprev")?.addEventListener("click", () => { e.cur = Math.max(0, e.cur-1); renderExam(); });
  $("#xnext")?.addEventListener("click", () => { e.cur = Math.min(e.qs.length-1, e.cur+1); renderExam(); });
  $("#xflag")?.addEventListener("click", () => { e.flag[e.cur] = !e.flag[e.cur]; renderExam(); });
  $("#xtoB")?.addEventListener("click", () => { e.sec = "B"; renderExam(); window.scrollTo({top:0}); });
  $$("[data-task]").forEach(b => b.addEventListener("click", () => { e.tcur = +b.dataset.task; renderExam(); window.scrollTo({top:0}); }));
  $$("textarea[data-key]").forEach(ta => {
    ta.addEventListener("input", () => { e.text[ta.dataset.key] = ta.value; });
    ta.addEventListener("keydown", ev => { if (ev.key === "Tab" && !ev.shiftKey && ta.classList.contains("code")){ ev.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); e.text[ta.dataset.key] = ta.value; } });
  });
  $$("[data-mark]").forEach(b => b.addEventListener("click", () => {
    e.marks[b.dataset.mark] = +b.dataset.v;
    const key = `best:${S.track}:${e.paper}:full`, total = mcqScore() + bScore(), prev = store.get(key, null);
    if (e.mode === "full" && (prev === null || total > prev)) store.set(key, total);
    const y = window.scrollY; renderExam(); window.scrollTo({top:y});
  }));
  $$("[data-filter]").forEach(b => b.addEventListener("click", () => { e.filter = b.dataset.filter; renderExam(); }));
}
document.addEventListener("keydown", ev => {
  if (S.view !== "exam" || !exam || exam.submitted || exam.sec !== "A" || exam.confirm) return;
  if (/^(TEXTAREA|INPUT|SELECT)$/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase(), map = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if (k in map){ exam.pick[exam.cur] = map[k]; renderExam(); ev.preventDefault(); }
  else if (ev.key === "ArrowRight"){ exam.cur = Math.min(exam.qs.length-1, exam.cur+1); renderExam(); ev.preventDefault(); }
  else if (ev.key === "ArrowLeft"){ exam.cur = Math.max(0, exam.cur-1); renderExam(); ev.preventDefault(); }
  else if (k === "f"){ exam.flag[exam.cur] = !exam.flag[exam.cur]; renderExam(); ev.preventDefault(); }
});

/* ---------- Python (Skulpt) ---------- */
let skulptReady = null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Python could not load")); document.head.appendChild(s); }); }
function loadSkulpt(){
  if (!skulptReady) skulptReady = loadScript("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js")
    .then(()=>loadScript("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"))
    .catch(e=>{ skulptReady=null; throw e; });
  return skulptReady;
}
function runPy(code){
  let out = "";
  Sk.configure({
    output: t => { out += t; },
    read: f => { if (Sk.builtinFiles===undefined || Sk.builtinFiles.files[f]===undefined) throw "File not found: '"+f+"'"; return Sk.builtinFiles.files[f]; },
    __future__: Sk.python3, execLimit: 5000, yieldLimit: 100
  });
  return Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>", false, code, true))
    .then(()=>({out, err:null}), e=>({out, err: (e && e.toString) ? e.toString().replace("TimeLimitError","The code ran too long (an endless loop?). TimeLimitError") : String(e)}));
}

render();
